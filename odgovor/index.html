<!doctype html><html lang="sr-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>AUREA · Nedeljni puls</title><style>:root{--wine:#481c29;--gold:#b89975;--cream:#f8f4ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f8f4ef,#f0e7df);color:#3d2b31;font:17px/1.65 Georgia,serif}main{max-width:780px;margin:30px auto;padding:clamp(20px,5vw,50px)}header{letter-spacing:.25em;font-size:29px;color:var(--wine);padding-bottom:20px;border-bottom:1px solid #d8c7b9}section{background:#fffdfa;border:1px solid #e4d7cb;border-radius:22px;padding:clamp(22px,5vw,44px);margin-top:25px;box-shadow:0 18px 48px #481c290a}h1{font:normal clamp(30px,5vw,47px)/1.18 Georgia,serif;color:var(--wine)}p{color:#6e6062}.eyebrow{font-size:12px;letter-spacing:.16em;color:#8c6f5c}.question{font-size:clamp(22px,3vw,29px);color:var(--wine)}.choices{display:grid;gap:11px}.choice{display:flex;align-items:center;gap:12px;border:1px solid #e0d2c7;border-radius:12px;padding:14px;cursor:pointer}.choice:has(input:checked){background:#f4eae5;border-color:#8d6470}input{accent-color:var(--wine);width:19px;height:19px;flex:none}button{background:var(--wine);color:white;border:1px solid var(--wine);border-radius:30px;padding:13px 25px;font:17px Georgia,serif;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#back{display:inline-flex;align-items:center;gap:9px}#back span{font:24px/1 Georgia,serif;transition:transform .2s}#back:not(:disabled):hover span{transform:translateX(-3px)}.row{display:flex;justify-content:space-between;gap:12px;margin-top:25px}#back{background:transparent;color:var(--wine)}.progress{height:4px;background:#eee3d9;margin:20px 0 35px}.progress div{height:100%;background:var(--gold);transition:width .3s}small{color:#74686b}a{color:var(--wine)}.hidden{display:none}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}@media(prefers-reduced-motion:reduce){.progress div{transition:none}}</style></head><body><main><header>AUREA</header><section id="content" aria-live="polite"><h1>Vaš nedeljni puls</h1><p>Proveravamo Vašu pozivnicu…</p></section><p><small>Odgovori se prikupljaju samo uz važeću pojedinačnu pozivnicu. Rukovodilac dobija isključivo dozvoljene grupne uvide, ne pojedinačne odgovore.</small></p></main><script>
'use strict';
const endpoint='https://ublzmoroanhlcgpnxilw.supabase.co/functions/v1/aurea-employee-pulse-staging';
const token=new URLSearchParams(location.search).get('token');history.replaceState(null,'',location.pathname);
const box=document.getElementById('content'),labels=['Uopšte se ne slažem','Uglavnom se ne slažem','Niti se slažem niti se ne slažem','Uglavnom se slažem','Potpuno se slažem','Ne mogu da procenim / nije primenljivo'];
let questions=[],step=0,answers={},busy=false;
function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function call(action,answers){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token,answers})});if(!r.ok)throw Error('Usluga trenutno nije dostupna.');return await r.json()}
function message(title,body){box.innerHTML='<div class="eyebrow">AUREA / PULS TIMA</div><h1>'+escapeHTML(title)+'</h1><p>'+escapeHTML(body)+'</p>'}
function render(){const q=questions[step];box.innerHTML='<div class="eyebrow">NEDELJNI PULS · PITANJE '+(step+1)+' OD '+questions.length+'</div><div class="progress"><div style="width:'+((step+1)/questions.length*100)+'%"></div></div><h1 class="question">'+escapeHTML(q.wording)+'</h1><div class="choices">'+labels.map((l,i)=>'<label class="choice"><input type="radio" name="answer" value="'+(i+1)+'" '+(answers[q.code]===i+1?'checked':'')+'><span>'+escapeHTML(l)+'</span></label>').join('')+'</div><div class="row"><button type="button" id="back" '+(step===0?'disabled':'')+'><span aria-hidden="true">←</span> Prethodno</button><button type="button" id="next" '+(answers[q.code]?'':'disabled')+'>'+(step===questions.length-1?'Pošaljite odgovore':'Nastavite')+'</button></div><p><small>Odgovor možete promeniti pre slanja. Odgovori se šalju tek nakon poslednjeg pitanja.</small></p>';
 box.querySelectorAll('input').forEach(i=>i.onchange=()=>{answers[q.code]=Number(i.value);render()});
 document.getElementById('back').onclick=()=>{if(step>0){step--;render()}};
 document.getElementById('next').onclick=async()=>{if(busy||!answers[q.code])return;if(step<questions.length-1){step++;render();return}busy=true;document.getElementById('next').disabled=true;try{const r=await call('submit',questions.map(x=>({code:x.code,rating:answers[x.code]})));if(r.status==='submitted'){message('Hvala na izdvojenom vremenu.','Vaši odgovori su uspešno predati. Grupni izveštaji se prikazuju samo kada su ispunjeni uslovi zaštite privatnosti.')}else{message('Odgovori nisu poslati.','Pozivnica više nije dostupna. Proverite da li je već iskorišćena ili je ciklus zatvoren.')}}catch{message('Slanje nije uspelo.','Proverite vezu i ponovo otvorite svoju pozivnicu. Ako je slanje ipak uspelo, pozivnica će biti označena kao iskorišćena.')}finally{busy=false}};
}
(async()=>{if(!token||!/^[a-f0-9]{64}$/.test(token)){message('Potreban je pristupni link.','Otvorite jedinstvenu pozivnicu koju ste dobili od kompanije.');return}try{const r=await call('load');if(r.status!=='ready'||!Array.isArray(r.questions)||r.questions.length!==4){message('Pozivnica nije dostupna.','Moguće je da je već iskorišćena, istekla ili ciklus nije otvoren.');return}questions=r.questions;render()}catch{message('Trenutno nije moguće učitati upitnik.','Pokušajte ponovo kasnije.')}})();
</script></body></html>
