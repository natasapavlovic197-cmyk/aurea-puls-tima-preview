<!doctype html>
<html lang="sr-Latn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREA · Administracija kompanija QA</title>
<style>body{background:#f8f5f1;color:#35262b;font:16px system-ui;max-width:1050px;margin:36px auto;padding:20px}h1,h2{font-family:Georgia;color:#792e48}section{background:white;border:1px solid #ded2d5;border-radius:14px;padding:22px;margin:18px 0}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:10px;border:1px solid #b9a4ac;border-radius:6px;max-width:100%;box-sizing:border-box}button{background:#792e48;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5}output{display:block;white-space:pre-line;margin:20px 0}small{color:#6d535c}article{border-top:1px solid #ded2d5;padding:14px 0}input[type=number]{width:130px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a17e8b}.notice{background:#eee8e3;padding:14px;border-radius:8px}</style></head>
<body><h1>AUREA · Administracija kompanija</h1><p class="notice">Isključivo staging QA. Koristite izmišljene kompanije. Podaci se čuvaju u staging bazi. Nema stvarnih uplata, aktivacije ni slanja poruka.</p>
<section><label>Javni Supabase ključ <input id="key" autocomplete="off"></label><label>Testni email <input id="email" type="email" autocomplete="username"></label><label>Lozinka <input id="password" type="password" autocomplete="current-password"></label><button id="connect" type="button">Prijava</button><button id="logout" type="button">Odjava</button></section><section><h2>Nova kompanija</h2><form id="quote"><label>Naziv testne kompanije <input id="company" required maxlength="120" placeholder="Kompanija QA"></label><label>Broj zaposlenih <input id="seats" type="number" min="1" max="100000" step="1" required value="50"></label><label>Paket <select id="plan"><option value="monthly">Mesečni</option><option value="annual">Godišnji</option><option value="gift">Poklonjena licenca</option></select></label><button type="submit">Registruj testnu kompaniju</button></form><output id="result" aria-live="polite"></output><small>Minimum 39 EUR mesečno. Godišnji paket se plaća unapred. Iznosi bez eventualnog PDV-a.</small></section>
<section><h2>Kompanije i pretplate</h2><div id="companies"></div></section>
<script>
'use strict';
const companies=new Map(), $=id=>document.getElementById(id);let token='',key='',busy=false;const base='https://ublzmoroanhlcgpnxilw.supabase.co';
async function api(path,data){if(!token)throw Error('Prijava potrebna');const r=await fetch(base+'/functions/v1/aurea-admin-staging',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action:path==='accounts'?'list':path,payload:data||{}})});if(!r.ok){if(r.status===401||r.status===403){token='';companies.clear();render()}throw Error('Zahtev odbijen')}return r.json()}
async function billingApi(action,payload){if(!token)throw Error('Prijava potrebna');const r=await fetch(base+'/functions/v1/aurea-admin-staging',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action,payload})});if(!r.ok)throw Error('Billing zahtev odbijen');return r.json()}
async function reload(){const rows=await api('accounts');companies.clear();for(const a of rows)companies.set(a.organization_id,{id:a.organization_id,name:a.name,seats:a.seats,plan:a.plan,renew:a.renewal_enabled,suspended:a.suspended,status:a.status});render()}
async function run(fn){if(busy)return;busy=true;try{await fn();await reload();$('result').textContent='Sačuvano u QA bazi.'}catch{$('result').textContent='Zahtev nije potvrđen. Proverite pristup i ponovo učitajte stanje.'}finally{busy=false}}
function change(a,operation,value){return run(()=>api('change',{id:a.id,operation,value}))}
$('connect').addEventListener('click',()=>run(async()=>{token='';companies.clear();render();key=$('key').value.trim();if(!key.startsWith('sb_publishable_'))throw Error('Potreban javni ključ');const password=$('password').value;$('password').value='';const r=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password})});if(!r.ok)throw Error('Prijava odbijena');token=(await r.json()).access_token;if(!token)throw Error('Nema sesije')}));$('logout').addEventListener('click',async()=>{if(busy)return;busy=true;try{if(token){const r=await fetch(base+'/auth/v1/logout?scope=local',{method:'POST',headers:{apikey:key,Authorization:'Bearer '+token}});if(!r.ok)throw Error('Odjava nije potvrđena')}$('result').textContent='Odjavljeni ste.'}catch{$('result').textContent='Lokalni pristup uklonjen; serverska odjava nije potvrđena.'}finally{token='';companies.clear();render();busy=false}});
const eur=c=>new Intl.NumberFormat('sr-Latn-RS',{style:'currency',currency:'EUR'}).format(c/100);
function price(n,p){return p==='gift'?0:Math.max(3900,n*(p==='annual'?250:300))*(p==='annual'?12:1)}
function valid(n){return Number.isSafeInteger(n)&&n>=1&&n<=100000}
function status(a){return ({suspended:'Suspendovana',complimentary:'Poklonjena',trial:'Probni period',active:'Aktivna',expired:'Istekla'})[a.status]||'Nepoznato'}
function node(tag,txt){const x=document.createElement(tag);x.textContent=txt;return x}
function button(txt,fn){const b=node('button',txt);b.type='button';b.addEventListener('click',fn);return b}
function render(){const root=$('companies');root.replaceChildren();if(!companies.size){root.append(node('p','Nema registrovanih testnih kompanija.'));return}
 for(const a of companies.values()){const row=document.createElement('article');row.append(node('h3',a.name),node('p','ID: '+a.id),node('p',status(a)+' · '+a.seats+' zaposlenih · '+eur(price(a.seats,a.plan))+' po obračunskom periodu'),node('p','Obnova: '+(a.renew?'uključena (simulacija)':'isključena')));
 const input=document.createElement('input');input.type='number';input.min=1;input.max=100000;input.step=1;input.value=a.seats;input.setAttribute('aria-label','Novi broj zaposlenih');
 row.append(input,button('Sačuvaj broj',()=>{const n=Number(input.value);if(!valid(n)){ $('result').textContent='Neispravan broj zaposlenih.';return}change(a,'seats',n)}));
 const plan=document.createElement('select');plan.setAttribute('aria-label','Paket za sledeći period');for(const [v,t] of [['monthly','Mesečni'],['annual','Godišnji'],['gift','Poklonjena']]){const o=node('option',t);o.value=v;plan.append(o)}plan.value=a.plan;row.append(plan,button('Sačuvaj paket',()=>{if(a.plan==='gift'&&plan.value!=='gift'){ $('result').textContent='Ukidanje poklona zahteva zasebnu odluku.';return}change(a,'plan',plan.value)}));
 const renew=button(a.renew?'Isključi obnovu':'Uključi obnovu',()=>{if(a.plan==='gift'||a.suspended)return;change(a,'renewal',!a.renew)});renew.disabled=a.plan==='gift'||a.suspended;row.append(renew,button(a.suspended?'Vrati testni pristup':'Suspenduj testni pristup',()=>{change(a,'suspended',!a.suspended)}));row.append(button('Naplata i evidencija',()=>showBilling(a,row)));root.append(row)
 }}
async function showBilling(a,row){
 const old=row.querySelector('.billing');if(old)old.remove();
 const panel=document.createElement('section');panel.className='billing';row.append(panel);
 const msg=node('p','');panel.append(msg);
 const field=(label,type,value='')=>{const l=node('label',label);const i=document.createElement('input');i.type=type;i.value=value;l.append(i);panel.append(l);return i};
 const curr=field('Valuta (RSD ili EUR)','text','RSD'),rate=field('Obračunski kurs — potvrđen od knjigovođe','text',''),date=field('Datum kursa','date','');
 const refresh=async()=>{const orders=await billingApi('billing_list',{org:a.id});const old=panel.querySelector('.orders');if(old)old.remove();const list=document.createElement('div');list.className='orders';panel.append(list);
 for(const o of orders){const line=node('div',o.invoice_id+' · '+new Intl.NumberFormat('sr-Latn-RS',{style:'currency',currency:o.currency}).format(Number(o.amount_minor)/100)+' · '+(o.paid_at?'Plaćeno':o.cancelled_at?'Otkazano':'Otvoreno'));list.append(line)}
 const keys=['invoice_id','organization_id','seats','plan','currency','eur_cents','rate','rate_date','amount_minor','method','created_at','paid_at','cancelled_at','transaction_ref','received_at','statement_ref','booked_on','operator_id'];
 const cell=x=>{let v=String(x??'');if(/^[\s]*[=+@-]/.test(v)||/^[\t\r\n]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'};
 list.append(button('Izvezi CSV za knjigovođu',()=>{const blob=new Blob(['\uFEFF'+[keys.join(';'),...orders.map(o=>keys.map(k=>cell(o[k])).join(';'))].join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='aurea-billing-'+a.id+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}));
 };
 const act=async(fn)=>{if(busy)return;busy=true;try{await fn();await refresh();msg.textContent='Potvrđeno u QA bazi.'}catch{msg.textContent='Zahtev odbijen ili stanje nije potvrđeno.'}finally{busy=false}};
 const issue=button('Izdaj testni nalog',()=>act(()=>billingApi('billing_issue',{org:a.id,currency:curr.value,rate:rate.value,rate_date:date.value})));issue.disabled=a.plan==='gift'||a.suspended;panel.append(issue);
 const inv=field('ID naloga','text'),ref=field('Jedinstvena referenca bankovne transakcije','text'),statement=field('Broj bankovnog izvoda','text'),booked=field('Datum knjiženja','date'),amount=field('Iznos u najmanjoj jedinici (para/cent)','number'),paidCurrency=field('Valuta uplate','text','RSD');
 const confirm=button('Potvrdi testnu uplatu sa izvoda',()=>{if(!window.confirm('Potvrđujete da je sintetička uplata proverena prema testnom izvodu?'))return;act(()=>billingApi('billing_confirm_bank',{org:a.id,invoice:inv.value,reference:ref.value,statement_ref:statement.value,booked_on:booked.value,amount_minor:amount.value,currency:paidCurrency.value}))});confirm.disabled=a.plan==='gift'||a.suspended;panel.append(confirm);
 try{await refresh()}catch{msg.textContent='Billing servis nije dostupan.'}
}
$('quote').addEventListener('submit',e=>{e.preventDefault();const name=$('company').value.trim(),seats=Number($('seats').value),plan=$('plan').value;if(!name||!valid(seats)||!['monthly','annual','gift'].includes(plan))return;run(()=>api('register',{name,seats,plan}))});render();
</script></body></html>
