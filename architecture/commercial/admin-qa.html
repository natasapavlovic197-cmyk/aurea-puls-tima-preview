<!doctype html><html lang="sr-Latn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREA · Komercijalna administracija QA</title><style>body{background:#f8f5f1;color:#35262b;font:16px system-ui;max-width:720px;margin:50px auto;padding:20px}h1{font:32px Georgia;color:#792e48}section{background:white;border:1px solid #ded2d5;border-radius:14px;padding:24px}label{display:block;margin:14px 0}input,select,button{font:inherit;padding:10px;border:1px solid #b9a4ac;border-radius:6px}button{background:#792e48;color:white}output{display:block;white-space:pre-line;margin:20px 0}small{color:#6d535c}</style><h1>AUREA · Komercijalna administracija</h1><p>Izolovani QA prikaz. Nije povezan sa bazom i ne evidentira stvarne uplate.</p><section><form id="quote"><label>Kompanija <input id="company" required maxlength="120" value="Studio Magnolija QA"></label><label>Broj licenci <input id="seats" type="number" min="1" max="100000" step="1" required value="50"></label><label>Pretplata <select id="plan"><option value="annual">Godišnja</option><option value="monthly">Mesečna</option></select></label><button>Izračunaj testnu ponudu</button></form><output id="result" aria-live="polite"></output><small>Minimum 39 EUR mesečno. Godišnja pretplata se u ovom modelu plaća unapred. Iznosi ne uključuju eventualni PDV.</small></section><script>'use strict';document.querySelector('#quote').addEventListener('submit',e=>{e.preventDefault();const n=Number(document.querySelector('#seats').value),p=document.querySelector('#plan').value;if(!Number.isSafeInteger(n)||n<1||n>100000)return;const monthly=Math.max(3900,n*(p==='annual'?250:300)),total=monthly*(p==='annual'?12:1);const eur=c=>new Intl.NumberFormat('sr-Latn-RS',{style:'currency',currency:'EUR'}).format(c/100);document.querySelector('#result').textContent='Kompanija: '+document.querySelector('#company').value+'\nMesečna protivvrednost: '+eur(monthly)+'\nTestni iznos za uplatu: '+eur(total);});</script></html>
