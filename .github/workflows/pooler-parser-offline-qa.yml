name: AUREA pooler parser offline QA
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - 'architecture/supabase-pooler-metadata*'
      - '.github/workflows/pooler-parser-offline-qa.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test architecture/supabase-pooler-metadata.test.cjs
