name: AUREA JIT read-only check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurea-jit-readonly-check
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: aurea-staging-admin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline guard tests
        run: node --test architecture/edge-alternative/admin/jit-readonly.test.cjs
      - name: Inspect existing authorization and JIT SSL metadata
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node architecture/edge-alternative/admin/jit-readonly.cjs
