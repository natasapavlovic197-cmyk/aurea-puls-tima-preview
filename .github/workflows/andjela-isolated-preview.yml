name: Build isolated Andjela no-hologram preview
on:
  push:
    paths:
      - '.github/workflows/andjela-isolated-preview.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create independent Kringle preview with discrete full-face expressions
        shell: python
        run: |
          from pathlib import Path
          source=Path('kringle/index.html')
          assert source.exists()
          s=source.read_text(encoding='utf-8')
          assert 'aurea-v13-andjela-shared-transitions' in s
          assert 'portrait-andjela' in s
          # Switch the three-expression sprite without translucent intermediate faces.
          # Preserve the exact source portrait, pose state, dialogue and layout.
          patch="""<style id="aurea-andjela-no-hologram-test">
          /* AUREA isolated comparison: no simultaneous translucent face images. */
          #exercise-portrait .portrait-shot.portrait-andjela > .portrait-frame {
            animation:none!important;
            transition:transform 240ms ease-out, filter 240ms ease-out!important;
            background-size:300% 100%!important;
            opacity:1!important;
            will-change:auto!important;
          }
          #exercise-portrait .portrait-shot.portrait-andjela .portrait-face,
          #exercise-portrait .portrait-shot.portrait-andjela .face-layer {
            display:none!important;
          }
          #exercise-portrait .portrait-shot.portrait-andjela::before,
          #exercise-portrait .portrait-shot.portrait-andjela::after {
            animation:none!important;
            opacity:0!important;
          }
          @media (prefers-reduced-motion: reduce) {
            #exercise-portrait .portrait-shot.portrait-andjela > .portrait-frame {
              transition:none!important;
            }
          }
          </style>"""
          assert '</head>' in s
          s=s.replace('</head>',patch+'</head>',1)
          output=Path('kringle-andjela-test/index.html')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(s,encoding='utf-8')
          assert output.stat().st_size>3000000
          assert Path('kringle/index.html').read_text(encoding='utf-8') != ''
          print('PASS: isolated test created; original Kringle not modified')
      - name: Commit test page only
        shell: bash
        run: |
          git config user.name "AUREA QA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kringle-andjela-test/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Create isolated Anđela no-hologram comparison preview"
          git push
