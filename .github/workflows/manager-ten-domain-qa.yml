name: AUREA ten-domain manager data QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'architecture/manager-ten-domain-view.cjs'
      - 'architecture/manager-ten-domain-view.test.cjs'
      - 'architecture/manager-design-regression.test.cjs'
      - 'architecture/manager-step5-browser-qa.cjs'
      - 'rukovodilac/index.html'
      - 'zaposleni/index.html'
      - 'architecture/item-aware-trends.cjs'
      - 'architecture/psychometric-item-bank.cjs'
      - '.github/workflows/manager-ten-domain-qa.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test architecture/manager-ten-domain-view.test.cjs architecture/manager-design-regression.test.cjs
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: node architecture/manager-step5-browser-qa.cjs
