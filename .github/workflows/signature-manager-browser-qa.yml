name: Signature manager browser QA
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths: ['.github/workflows/signature-manager-browser-qa.yml', 'architecture/premium-manager-browser-qa.cjs', 'architecture/premium-manager-view.cjs', 'architecture/signature-manager-simulation.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2 esbuild@0.25.5 @supabase/supabase-js@2.49.4
          npx playwright install --with-deps chromium
      - run: node architecture/build-staging-manager.cjs
      - run: node architecture/premium-manager-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signature-manager-visual-qa
          path: artifacts/signature-manager/
          retention-days: 7
