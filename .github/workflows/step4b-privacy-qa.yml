name: AUREA Step 4B synthetic analytics QA
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - '.github/workflows/step4b-privacy-qa.yml'
      - 'architecture/privacy-hardening-*.cjs'
      - 'architecture/publication-freshness.cjs'
      - 'architecture/manager-action-plan.cjs'
      - 'architecture/published-manager-report.cjs'
      - 'architecture/manager-authorized-service.cjs'
      - 'architecture/weekly-report-digest.cjs'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic boundary and existing analytics regressions
        run: |
          node --test architecture/privacy-hardening-boundary.test.cjs architecture/psychometric-item-bank.test.cjs architecture/item-aware-trends.test.cjs architecture/manager-action-plan.test.cjs architecture/manager-interventions.test.cjs architecture/manager-ten-domain-view.test.cjs architecture/publication-row-adapter.test.cjs architecture/published-manager-report.test.cjs architecture/manager-authorized-service.test.cjs architecture/weekly-report-digest.test.cjs architecture/privacy-guard.test.cjs architecture/report-release.test.cjs
