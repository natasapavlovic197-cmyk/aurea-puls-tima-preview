name: AUREA step 7 infrastructure QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'architecture/manager-session-adapter*'
      - 'architecture/manager-server-entry*'
      - 'architecture/published-*.cjs'
      - 'architecture/publication-row-adapter*.cjs'
      - 'architecture/supabase-manager-bridge.cjs'
      - 'architecture/manager-activity-bridge.test.cjs'
      - 'architecture/manager-authorized-service*.cjs'
      - 'architecture/manager-workspace-endpoint*.cjs'
      - 'architecture/manager-runtime.cjs'
      - 'architecture/weekly-cycle-planner*.cjs'
      - 'architecture/weekly-delivery-*.cjs'
      - '.github/workflows/step7-infrastructure-qa.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test architecture/published-manager-report.test.cjs architecture/published-report-endpoint.test.cjs architecture/weekly-cycle-planner.test.cjs architecture/publication-row-adapter.test.cjs architecture/manager-activity-bridge.test.cjs architecture/manager-authorized-service.test.cjs architecture/manager-workspace-endpoint.test.cjs architecture/manager-server-entry.test.cjs architecture/manager-session-adapter.test.cjs architecture/manager-company-selector.test.cjs architecture/manager-company-reader.test.cjs architecture/staging-manager-server.test.cjs architecture/employee-live-client.test.cjs architecture/employee-endpoint.test.cjs architecture/employee-http-integration.test.cjs architecture/employee-postgres-bridge.test.cjs architecture/limiter-role-query.test.cjs architecture/weekly-delivery-worker.test.cjs
