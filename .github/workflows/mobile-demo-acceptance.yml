name: AUREA mobile demo acceptance
on:
  push:
    paths:
      - '.github/workflows/mobile-demo-acceptance.yml'
      - 'tests/**'
      - 'playwright.config.cjs'
  workflow_dispatch:
jobs:
  mobile-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test both locked demo journeys at iPhone 13 viewport
        run: npx playwright test --config=playwright.config.cjs
      - name: Keep screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurea-mobile-demo-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 7
