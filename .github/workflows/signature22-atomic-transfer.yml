name: Signature Step 3D atomic transfer QA
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths: ['signature22-step3d-source.zip', '.github/workflows/signature22-atomic-transfer.yml']
permissions:
  contents: read
concurrency:
  group: signature22-atomic-transfer
  cancel-in-progress: false
env:
  EXPECTED_BASE: 7041915f3cc07b72b634b24dd8ea72204d257f69
  PATCH_MANIFEST: |
    1075db005fb840b424b48f2b96064eaebb1cb8f18b35506b5f69f70f68170910 architecture/premium-manager-template.cjs
    42eac3b16dc320aaa83e149d7f92767d4922c1778e424b512a768350c7ae7d82 architecture/build-staging-manager.cjs
    6a53ea2b18bab6821f0d1c506b014f1b3fafa1c8546a0ca25c2d67aab0202f78 architecture/signature-motion.js
    bccc461404dc2927f4503d39702a4181692de52f57df111f3e87d8306fb1f907 architecture/signature22-employee.css
    b6246c971001a2bd4c084cdeb8b7cb3e347f8514d4dc92cc28a133d2217271c6 architecture/signature22-education-browser-qa.cjs
    fa7d2d32c0f83105a261229dfdd7f8f4877c9708fb7d181fd5c932f036739ad0 architecture/signature22-manager.css
    ccbf60fc9560a6fcb6df61aeaedb5d95046db6b08056ba935ec1b15e4cca002c architecture/premium-employee-template.cjs
    f0c8a3582742bc423fafab1be0c52da583d5c17e19d942bd01c927aa024a05d3 architecture/signature22-education.test.cjs
    1825341db5ada2dd8c7be6a91e71f0fd22f5b13a043f9489316ff404e88a9b92 architecture/signature22-education-frame.cjs
    3b9743f0e5c4fbe8a66ba6ffc69fdadb1231599de724a8af610eb7f4f7214acd architecture/signature22-guide.cjs
    529382879c0348503a86d95792cb4bf98ac81cb4658f0a2dae9218bf840860e9 architecture/premium-manager-view.cjs
    6e1868073b69adeb4bed2c7c613f0345caf1482f2bf6fbc5e5db8b79a4c6a1aa architecture/employee-staging-entry.cjs
    f46dc55378e70f657d128ec74fb0831bc4d52a0cf38c93e8904dea57875d5705 architecture/signature22-education.cjs
    3e4da83f144c8004f5f975bc19ec41ac5159f219cdfe2e7a0166fc8e5177b65f architecture/assets/natasa-guide.webp
    4a11f4036309bf517b665e5e698fa142159e386fc2b3ce4b0bea46ca521ac08d architecture/assets/signature22-kringle.locked.html
jobs:
  qa:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact archive and extract only approved source files
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git diff --name-only "$EXPECTED_BASE" HEAD | sort)" = "$(printf '%s\n' '.github/workflows/signature22-atomic-transfer.yml' 'signature22-step3d-source.zip' | sort)"
          printf '%s\n' "$PATCH_MANIFEST" | awk 'NF' > /tmp/signature.sha256
          test "$(wc -l < /tmp/signature.sha256)" = 15
          printf '%s  %s\n' '1112a0881eb2580310441af2eec9056022fabbd6106b36b96d227b4f7a8a5bc3' 'signature22-step3d-source.zip' | sha256sum -c -
          python <<'PY'
          import hashlib,pathlib,subprocess,zipfile
          original={
          'build-staging-manager.cjs':'79392caf5baacf649f141306a152274e2e5281f7',
          'employee-staging-entry.cjs':'d2d64307af4b02ed98ff8aea7a75b35a1e74da0e',
          'premium-employee-template.cjs':'3934e0213f445259e8ccda753286223b3b068bc0',
          'premium-manager-template.cjs':'ebf6724b7530cc8482de2f921969b4e0e0929837',
          'premium-manager-view.cjs':'d1f038fbc4ab106fa37505964f36778c79d1e8f0',
          'signature-manager-simulation.cjs':'29405215a4817f967da127c89427b2663e95496c'}
          for name,sha in original.items():
              assert subprocess.check_output(['git','hash-object','architecture/'+name],text=True).strip()==sha, name
          manifest={p:h for h,p in (line.split() for line in pathlib.Path('/tmp/signature.sha256').read_text().splitlines())}
          assert len(manifest)==15
          with zipfile.ZipFile('signature22-step3d-source.zip') as z:
              assert len(z.namelist())==15 and set(z.namelist())==set(manifest)
              for p,h in manifest.items():
                  b=z.read(p)
                  assert hashlib.sha256(b).hexdigest()==h, p
                  target=pathlib.Path(p)
                  assert not target.is_symlink() and target.resolve().is_relative_to(pathlib.Path.cwd())
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(b)
          PY
          sha256sum -c /tmp/signature.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fresh build and isolated QA
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts esbuild@0.25.5 @supabase/supabase-js@2.49.4 playwright@1.51.1
          node architecture/build-staging-manager.cjs
          node --test architecture/signature22-education.test.cjs
          npx playwright install --with-deps chromium
          # The locked 2.2 master intentionally hides the legacy exercise-back button.
          # Test actual visible Signature navigation, keeping the approved source bytes intact.
          python - <<'PY'
          from pathlib import Path
          p=Path('architecture/signature22-education-browser-qa.cjs')
          s=p.read_text()
          old="await frame.locator('#exercise-back').click();"
          assert s.count(old)==1
          new="assert.equal(await frame.locator('#exercise-back').isVisible(),false);const back=frame.locator('#aureaPolishBack');assert.equal(await back.isVisible(),true);await back.click();"
          Path('architecture/signature22-education-visible-qa.cjs').write_text(s.replace(old,new))
          PY
          node architecture/signature22-education-visible-qa.cjs
          rm architecture/signature22-education-visible-qa.cjs
          node architecture/employee-staging-browser-qa.cjs
          node architecture/premium-manager-browser-qa.cjs
          node architecture/joint-premium-security-qa.cjs
          sha256sum -c /tmp/signature.sha256
          mkdir /tmp/verified
          awk '{print $2}' /tmp/signature.sha256 | xargs -d '\n' -I '{}' cp --parents '{}' /tmp/verified
      - uses: actions/upload-artifact@v4
        with:
          name: signature22-verified-source
          path: /tmp/verified/
          if-no-files-found: error
          retention-days: 3
  promote:
    needs: qa
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: signature22-verified-source
          path: /tmp/verified
      - name: Verify again and push one atomic integration commit
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git ls-remote origin refs/heads/integration/employee-ten-domains-step5 | cut -f1)" = "$GITHUB_SHA"
          printf '%s\n' "$PATCH_MANIFEST" | awk 'NF' > /tmp/signature.sha256
          test "$(wc -l < /tmp/signature.sha256)" = 15
          (cd /tmp/verified && sha256sum -c /tmp/signature.sha256)
          while read -r hash file; do
            install -D -m 644 "/tmp/verified/$file" "$file"
            git add -- "$file"
          done < /tmp/signature.sha256
          sha256sum -c /tmp/signature.sha256
          test "$(git diff --cached --name-only | wc -l)" = 15
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate exact verified Signature 2.2 Step 3D'
          git push origin HEAD:refs/heads/integration/employee-ten-domains-step5
