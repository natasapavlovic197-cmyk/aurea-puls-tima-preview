name: Signature personal browser QA
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths: ['.github/workflows/signature-personal-browser-qa.yml', 'architecture/signature-personal-browser-qa.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2 esbuild@0.25.5
          npx playwright install --with-deps chromium
      - run: node architecture/signature-personal-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signature-personal-visual-qa
          path: artifacts/signature-personal/
          retention-days: 7
