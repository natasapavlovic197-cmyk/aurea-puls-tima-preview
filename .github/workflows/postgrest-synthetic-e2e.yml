name: AUREA synthetic HTTPS end-to-end
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - 'architecture/live-postgrest-e2e.cjs'
      - '.github/workflows/postgrest-synthetic-e2e.yml'
permissions:
  contents: read
concurrency:
  group: aurea-synthetic-https-e2e
  cancel-in-progress: false
jobs:
  e2e:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: aurea-staging-admin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Live employee flow with synthetic fixture and cleanup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node architecture/live-postgrest-e2e.cjs
