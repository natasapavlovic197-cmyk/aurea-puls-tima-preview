name: AUREA step 6 offline preflight
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - 'architecture/step6-preflight*'
      - 'architecture/employee-connection-preflight*'
      - 'architecture/manager-startup-gate*'
      - 'architecture/start-staging-manager.cjs'
      - '.github/workflows/step6-offline-preflight.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test architecture/step6-preflight.test.cjs architecture/employee-connection-preflight.test.cjs architecture/manager-startup-gate.test.cjs architecture/manager-deployment-preflight.test.cjs architecture/employee-runtime.test.cjs architecture/staging-pooler-config.test.cjs architecture/staging-admin-preflight.test.cjs architecture/restricted-pg-query.test.cjs architecture/netlify-manager-wiring.test.cjs architecture/netlify-manager-preflight.test.cjs
