name: AUREA Admin isolated QA
on:
  push:
    branches: [commercial/step6-isolated]
    paths:
      - 'architecture/commercial/admin-*'
      - '.github/workflows/commercial-admin-qa.yml'
permissions:
  contents: read
jobs:
  admin-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_qa_only
          POSTGRES_DB: aurea_admin_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable_qa_only
      PGDATABASE: aurea_admin_fixture
      AUREA_ADMIN_QA: '1'
      AUREA_QA_DB_PASSWORD: disposable_transport_qa_only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated fixtures and admin candidates
        run: |
          set -eu
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = aurea_admin_fixture
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA aurea_private;
          CREATE TABLE aurea_private.organizations(id uuid PRIMARY KEY, name text NOT NULL, created_at timestamptz DEFAULT now());
          SQL
          psql -X -v ON_ERROR_STOP=1 -f architecture/commercial/step6-candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f architecture/commercial/step5-lifecycle.review.sql
          psql -X -v ON_ERROR_STOP=1 -f architecture/commercial/admin-server.review.sql
      - name: Admin authorization and audit SQL
        run: psql -X -v ON_ERROR_STOP=1 -f architecture/commercial/admin-server.synthetic.sql
      - name: Provision synthetic restricted transport role
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE aurea_admin_transport_qa LOGIN PASSWORD 'disposable_transport_qa_only';
          GRANT USAGE ON SCHEMA aurea_admin TO aurea_admin_transport_qa;
          GRANT EXECUTE ON FUNCTION aurea_admin.list_accounts(),aurea_admin.register_company(text,integer,text),aurea_admin.change_company(uuid,text,jsonb) TO aurea_admin_transport_qa;
          INSERT INTO aurea_admin.operators(principal) VALUES('aurea_admin_transport_qa');
          SQL
      - name: Test protected HTTP and persistent accounts
        run: node --test architecture/commercial/admin-transport-qa.test.cjs
      - name: Verify persisted audit
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
           IF (SELECT count(*) FROM aurea_admin.audit)<>3 THEN RAISE EXCEPTION 'audit count'; END IF;
           IF EXISTS(SELECT 1 FROM aurea_admin.audit WHERE actor<>'aurea_admin_transport_qa') THEN RAISE EXCEPTION 'audit actor'; END IF;
          END $$;
          SQL
