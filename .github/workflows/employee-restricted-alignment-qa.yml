name: AUREA restricted employee alignment QA
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - 'architecture/employee-runtime*'
      - 'architecture/restricted-employee-adapter*'
      - 'architecture/employee-server-gateway*'
      - 'architecture/staging-employee-service*'
      - '.github/workflows/employee-restricted-alignment-qa.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test architecture/restricted-employee-adapter.test.cjs architecture/employee-server-gateway.test.cjs architecture/employee-runtime.test.cjs architecture/staging-employee-service.test.cjs architecture/staging-pooler-config.test.cjs
