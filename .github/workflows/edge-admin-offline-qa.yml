name: AUREA Edge admin offline QA
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - 'architecture/edge-alternative/admin/**'
      - '.github/workflows/edge-admin-offline-qa.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node architecture/edge-alternative/admin/offline.test.cjs
      - run: node architecture/edge-alternative/admin/management-api.test.cjs
      - run: node --test architecture/edge-alternative/admin/protected-rehearsal.test.cjs
      - run: node --test architecture/edge-alternative/admin/direct-sql-rehearsal.test.cjs
      - run: node --test architecture/edge-alternative/admin/jit-readonly.test.cjs
