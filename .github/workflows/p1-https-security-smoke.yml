name: AUREA P1 HTTPS security smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read-only staging HTTPS probes
        shell: bash
        run: |
          node <<'NODE'
          const cfg = require('./architecture/postgrest-runtime/staging-public-config.cjs');
          const base = 'https://ublzmoroanhlcgpnxilw.supabase.co';
          if (cfg.url.replace(/\/$/, '') !== base) throw Error('Wrong staging host');
          if (!cfg.key) throw Error('Missing public key');
          if (!cfg.key.startsWith('sb_publishable_')) {
            const claims = JSON.parse(Buffer.from(cfg.key.split('.')[1], 'base64url'));
            if (claims.role !== 'anon') throw Error('Non-anonymous key');
          }
          const id = '00000000-0000-0000-0000-000000000000';
          const invalid = {p_action:'invitation',p_token:'invalid',p_answers:null};
          let phase = 'initialization';
          function safeCode(value) {
            return typeof value === 'string' && /^(PGRST[0-9]{3}|[0-9A-Z]{5})$/.test(value) ? value : 'unreported';
          }
          function networkKind(error) {
            const allowed = ['ENOTFOUND','EAI_AGAIN','ECONNREFUSED','ECONNRESET','ETIMEDOUT','UND_ERR_CONNECT_TIMEOUT','UND_ERR_SOCKET','CERT_HAS_EXPIRED','UNABLE_TO_VERIFY_LEAF_SIGNATURE','SELF_SIGNED_CERT_IN_CHAIN'];
            const code = error?.cause?.code;
            if (allowed.includes(code)) return code;
            if (error?.name === 'TimeoutError' || error?.name === 'AbortError') return error.name;
            return 'unclassified';
          }
          async function probe(name, path, kind, extra = {}, body) {
            phase = name;
            const r = await fetch(base + '/rest/v1/' + path, {
              method: body === undefined ? 'GET' : 'POST',
              headers: {apikey: cfg.key, 'content-type': 'application/json', ...extra},
              body: body === undefined ? undefined : JSON.stringify(body),
              redirect: 'error', signal: AbortSignal.timeout(12000)
            });
            let code;
            try { code = (await r.json()).code; } catch { code = null; }
            const verdict = r.ok ? 'FAIL' :
              kind === 'schema' && r.status === 406 && code === 'PGRST106' ? 'PASS' :
              kind === 'rpc' && [401,403].includes(r.status) && code === '42501' ? 'PASS' :
              'UNCONFIRMED';
            console.log(`${verdict} ${name}: HTTP ${r.status}; code=${safeCode(code)}`);
            if (verdict !== 'PASS') process.exitCode = 1;
          }
          (async () => {
            phase = 'positive control';
            const control = await fetch(base + '/rest/v1/rpc/aurea_employee_pulse_v2', {
              method:'POST',headers:{apikey:cfg.key,'content-type':'application/json','Content-Profile':'public'},
              body:JSON.stringify(invalid),redirect:'error',signal:AbortSignal.timeout(12000)
            });
            let response;
            try { response = await control.json(); } catch { response = null; }
            console.log('CONTROL HTTP '+control.status+'; code='+safeCode(response?.code));
            if (control.status !== 200 || !response || response.status !== 'unavailable' || Object.keys(response).length !== 1) {
              console.error('UNCONFIRMED: positive control did not return the expected synthetic denial');
              process.exitCode = 1;
              return;
            }
            console.log('PASS public API control (invalid synthetic capability denied)');
            for (const schema of ['aurea_delivery_rpc','aurea_manager_rpc','aurea_private','aurea_rpc_private']) {
              await probe(schema, 'rpc/aurea_employee_pulse_v2', 'schema', {'Content-Profile':schema}, invalid);
            }
            for (const name of ['aurea_manager_actions','aurea_manager_cycles','aurea_manager_summary','aurea_my_companies']) {
              await probe(name, 'rpc/'+name, 'rpc', {}, name === 'aurea_my_companies' ? {} : {p_organization_id:id});
            }
            await probe('legacy invitation','rpc/aurea_employee_invitation','rpc',{}, {p_hash:'0'.repeat(64)});
            console.log('NOT TESTED over HTTPS: mutating RPCs; verify effective SQL privileges separately.');
          })().catch(error => { console.error('UNCONFIRMED: '+phase+'; transport='+networkKind(error)); process.exitCode = 1; });
          NODE
