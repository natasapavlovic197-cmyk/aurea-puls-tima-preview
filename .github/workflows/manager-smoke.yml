name: AUREA P1 HTTPS security (manual integration bridge)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager-smoke:
    if: github.ref != 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test fictional manager flow on mobile
        run: node .github/tests/manager-smoke.cjs
      - name: Test portal with synthetic API responses
        run: node .github/tests/portal-mock.cjs
      - name: Preserve mobile screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurea-mobile-visual-review
          path: test-artifacts/*.png
          if-no-files-found: ignore

  p1-https-security:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read-only staging HTTPS probes
        shell: bash
        run: |
          node <<'NODE'
          const cfg = require('./architecture/postgrest-runtime/staging-public-config.cjs');
          const base = 'https://ublzmoroanhlcgpnxilw.supabase.co';
          if (cfg.url.replace(/\/$/, '') !== base) throw Error('Wrong staging host');
          if (!cfg.key) throw Error('Missing public key');
          if (!cfg.key.startsWith('sb_publishable_')) {
            const claims = JSON.parse(Buffer.from(cfg.key.split('.')[1], 'base64url'));
            if (claims.role !== 'anon') throw Error('Non-anonymous key');
          }
          const id = '00000000-0000-0000-0000-000000000000';
          async function probe(name, path, kind, extra = {}, body) {
            const r = await fetch(base + '/rest/v1/' + path, {
              method: body === undefined ? 'GET' : 'POST',
              headers: {apikey: cfg.key, 'content-type': 'application/json', ...extra},
              body: body === undefined ? undefined : JSON.stringify(body),
              redirect: 'error', signal: AbortSignal.timeout(12000)
            });
            let code;
            try { code = (await r.json()).code; } catch { code = null; }
            const verdict = r.ok ? 'FAIL' :
              kind === 'schema' && r.status === 406 && code === 'PGRST106' ? 'PASS' :
              kind === 'rpc' && [401,403].includes(r.status) && code === '42501' ? 'PASS' :
              'UNCONFIRMED';
            console.log(`${verdict} ${name}: HTTP ${r.status}`);
            if (verdict !== 'PASS') process.exitCode = 1;
          }
          (async () => {
            const control = await fetch(base + '/rest/v1/', {headers:{apikey:cfg.key,'Accept-Profile':'public'},redirect:'error',signal:AbortSignal.timeout(12000)});
            await control.body?.cancel();
            if (!control.ok) throw Error('Public API control failed');
            console.log('PASS public API control');
            for (const schema of ['aurea_delivery_rpc','aurea_manager_rpc','aurea_private','aurea_rpc_private']) {
              await probe(schema, '', 'schema', {'Accept-Profile':schema});
            }
            for (const name of ['aurea_manager_actions','aurea_manager_cycles','aurea_manager_summary','aurea_my_companies']) {
              await probe(name, 'rpc/'+name, 'rpc', {}, name === 'aurea_my_companies' ? {} : {p_organization_id:id});
            }
            await probe('legacy invitation','rpc/aurea_employee_invitation','rpc',{}, {p_hash:'0'.repeat(64)});
            console.log('NOT TESTED over HTTPS: mutating RPCs; verify effective SQL privileges separately.');
          })().catch(() => { console.error('UNCONFIRMED: network or configuration failure'); process.exitCode = 1; });
          NODE
