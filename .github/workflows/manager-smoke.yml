name: AUREA manager mobile smoke test
on:
  workflow_dispatch:
jobs:
  manager-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test fictional manager flow on mobile
        run: node .github/tests/manager-smoke.cjs
      - name: Test portal with synthetic API responses
        run: node .github/tests/portal-mock.cjs
      - name: Preserve mobile screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurea-mobile-visual-review
          path: test-artifacts/*.png
          if-no-files-found: ignore
