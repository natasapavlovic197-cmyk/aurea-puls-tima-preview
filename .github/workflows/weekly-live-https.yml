name: AUREA weekly lifecycle HTTPS
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - 'architecture/live-weekly-https-e2e.cjs'
      - '.github/workflows/weekly-live-https.yml'
permissions:
  contents: read
concurrency:
  group: aurea-weekly-https-e2e
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: aurea-staging-admin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Weekly lifecycle test (synthetic provider only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node architecture/live-weekly-https-e2e.cjs
