name: AUREA staging provisioning dry run
on:
  workflow_dispatch:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - 'architecture/staging-pooler-config*'
      - 'architecture/staging-admin-preflight*'
      - '.github/workflows/staging-provisioning-plan.yml'
permissions:
  contents: read
jobs:
  plan:
    if: github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate synthetic configuration and regressions
        run: |
          set -e
          node architecture/staging-pooler-config.test.cjs
          node architecture/staging-admin-preflight.test.cjs
          node architecture/manager-deployment-preflight.test.cjs
          node architecture/restricted-pg-query.test.cjs
          node architecture/staging-manager-service.test.cjs
          node architecture/netlify-manager-wiring.test.cjs
          node architecture/netlify-manager-preflight.test.cjs
          node architecture/netlify-entrypoints.test.cjs
      - name: Confirm no provisioning
        run: echo 'DRY RUN ONLY. No credentials, API writes or deployment.'
