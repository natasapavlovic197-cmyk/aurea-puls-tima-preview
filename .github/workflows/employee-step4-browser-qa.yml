name: AUREA employee step 4 isolated browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'architecture/employee-step4-browser-qa.cjs'
      - 'architecture/employee-six-question-preview.html'
      - 'zaposleni/index.html'
      - '.github/workflows/employee-step4-browser-qa.yml'
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify preview
        run: node architecture/employee-step4-browser-qa.cjs
      - name: Verify integrated employee route
        env:
          AUREA_EMPLOYEE_FILE: ../zaposleni/index.html
        run: node architecture/employee-step4-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurea-employee-step4-qa
          path: artifacts/employee-step4/
          retention-days: 7
