name: AUREA step 7 workspace browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'architecture/manager-workspace-*'
      - '.github/workflows/manager-workspace-browser-qa.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node architecture/manager-workspace-browser-qa.cjs
