name: AUREA B2B privacy unit checks
on:
  push:
    paths:
      - 'architecture/**'
      - 'rukovodilac/**'
      - 'locked/**'
      - 'v4-demo/**'
      - '.github/workflows/b2b-privacy-checks.yml'
  workflow_dispatch:
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node architecture/privacy-guard.test.cjs
      - run: node architecture/staging-engine.test.cjs
      - run: node architecture/weekly-orchestrator.test.cjs
      - run: node architecture/report-release.test.cjs
      - run: node architecture/manager-rpc-adapter.test.mjs
      - run: node architecture/master-lock.test.cjs
