name: Inspect Kringle portrait transitions
on:
  push:
    paths:
      - '.github/workflows/inspect-kringle-portraits.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Identify portrait layers and transitions without modifying source
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('kringle/index.html').read_text(encoding='utf-8')
          print('SOURCE SIZE',len(s),'LINES',s.count('\\n')+1)
          patterns=['Anđela','Andjela','anđela','andjela','crossfade','morph','portrait','expression','face','opacity','transition']
          for p in patterns:
              matches=list(re.finditer(re.escape(p),s,re.I))
              print('\\nPATTERN',p,'COUNT',len(matches))
              for m in matches[:6]:
                  t=s[max(0,m.start()-190):min(len(s),m.end()+250)]
                  t=re.sub(r'data:image/[^\\s\\\"\\x27]+','[embedded-image]',t)
                  print(repr(t[:460]))
