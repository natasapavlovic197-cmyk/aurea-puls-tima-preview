name: Anđela final fix — branch-only Chromium gate
on:
  push:
    branches:
      - qa/andjela-mimika-20261123
    paths:
      - .github/workflows/andjela-final-staging.yml
  workflow_dispatch:
jobs:
  verify-and-commit:
    if: github.ref == 'refs/heads/qa/andjela-mimika-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal Anđela changes in staging working tree only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          orig=Path('kringle/index.html')
          iso=Path('kringle-andjela-test/index.html')
          a=orig.read_text(encoding='utf8')
          b=iso.read_text(encoding='utf8')
          raw=a.encode('utf8')
          sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          assert sha=='bf1e37997be560c2fc9ba9c7ce1f5402007332dd', 'Wrong source version; preserve approved staging modifications'
          m=re.search(r'<style id="aurea-andjela-no-hologram-test">[\s\S]*?</style>',b)
          assert m and b.replace(m.group(0),'')==a, 'Isolated test must differ from original only by its CSS patch'
          assert "if (speaker === 'andjela')" in a and "shot.dataset.emotion = emotion;" in a
          assert a.count('id="aurea-andjela-3frame-sprite-final"')==0, 'Already patched; do not duplicate'
          css="""<style id="aurea-andjela-3frame-sprite-final">
          /* One complete 4:5 portrait per frame. This overrides old higher-specificity cover rules. */
          #exercise-portrait .portrait-shot.portrait-andjela > .portrait-frame,
          #exercise-portrait .portrait-shot.portrait-andjela[data-pose="speaking"] > .portrait-frame,
          #exercise-portrait .portrait-shot.portrait-andjela[data-pose="reflecting"] > .portrait-frame {
            background-size:300% 100%!important;
          }
          </style>"""
          assert a.count('</head>')>=1, 'No HTML head found'
          a=a.replace('</head>',css+'</head>',1)
          newb=a.replace('</head>',m.group(0)+'</head>',1)
          assert newb.replace(m.group(0),'')==a
          orig.write_text(a,encoding='utf8')
          iso.write_text(newb,encoding='utf8')
          print('PASS: three original photographic frames use exact 300% x 100% sprite geometry; original/test pair preserved')
          PY
      - name: Install isolated Chromium QA
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test pixels, three existing photographs, six semantic states and real dialogue
        run: node architecture/andjela-browser-qa.mjs
      - name: Upload QA screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andjela-final-branch-qa
          path: artifacts/andjela-qa/
          retention-days: 7
      - name: Commit staging files only after passing browser QA
        if: success()
        run: |
          git diff --check
          git config user.name "AUREA QA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kringle/index.html kringle-andjela-test/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize Anđela 3-frame portrait transitions without ghosting (staging only)"
          git push
