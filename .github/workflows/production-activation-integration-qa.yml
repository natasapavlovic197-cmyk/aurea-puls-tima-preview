name: AUREA activation package correction — import smoke only
on:
  push:
    branches: [production/activation-pilot-preparation]
    paths: ['.github/workflows/production-activation-integration-qa.yml']
permissions:
  contents: read
jobs:
  integration:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/production/activation-pilot-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm unchanged protected sources
        run: |
          git diff --exit-code ac1bcf3a3d5350d44c63960a0b45ee20100fa00a -- ':!architecture/activation-candidate/**' ':!architecture/postgrest-runtime/production-public-config.cjs' ':!architecture/postgrest-runtime/production-runtime-gate.cjs' ':!architecture/production-manager-entry.cjs' ':!architecture/production-employee-entry.cjs' ':!architecture/production-manager-login-bootstrap.cjs' ':!architecture/postgrest-runtime/production-browser-transport.cjs' ':!architecture/build-production-manager.cjs' ':!.github/workflows/production-activation-integration-qa.yml'
      - name: Compile candidate, no deploy
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund esbuild@0.25.5 @supabase/supabase-js@2.49.4
          node architecture/activation-candidate/build-review.cjs
          env -i PATH="$PATH" node architecture/activation-candidate/package-import-smoke.mjs
          cd activation-review-output
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/activation-sha256
          cp /tmp/activation-sha256 SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aurea-activation-integration-review
          path: activation-review-output/
          retention-days: 7
          if-no-files-found: error
