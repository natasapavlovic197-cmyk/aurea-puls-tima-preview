name: A3 isolated weekly rehearsal
on:
  workflow_dispatch:
  push:
    branches:
      - integration/employee-ten-domains-step5
    paths:
      - '.github/workflows/a3-weekly-rehearsal.yml'
      - 'architecture/a3-weekly-delivery-rehearsal.test.cjs'
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test architecture/a3-weekly-delivery-rehearsal.test.cjs architecture/full-week-rehearsal.test.cjs architecture/weekly-report-digest.test.cjs architecture/weekly-delivery-pipeline.test.cjs
