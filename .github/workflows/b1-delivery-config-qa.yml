name: B1 isolated delivery configuration QA
on:
  workflow_dispatch:
  push:
    branches:
      - integration/employee-ten-domains-step5
    paths:
      - '.github/workflows/b1-delivery-config-qa.yml'
      - 'architecture/staging-delivery-service*.cjs'
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test architecture/staging-delivery-service.test.cjs architecture/weekly-delivery-pipeline.test.cjs
