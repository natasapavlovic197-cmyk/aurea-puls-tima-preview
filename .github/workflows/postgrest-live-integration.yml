name: AUREA PostgREST live integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  https:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node architecture/postgrest-runtime/https-live-check.cjs
