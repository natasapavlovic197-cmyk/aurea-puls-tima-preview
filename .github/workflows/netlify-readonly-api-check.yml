name: AUREA P2.4 administrative login read-only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurea-staging-admin-login
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    environment: aurea-staging-admin
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify public CA and read-only administrative session
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_ADMIN_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = 'natasapavlovic197-cmyk/aurea-puls-tima-preview'
          test "$GITHUB_REF" = 'refs/heads/integration/employee-ten-domains-step5'
          if [ -z "${PGPASSWORD:-}" ]; then echo 'BLOCKED: admin secret absent'; exit 1; fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"; unset PGPASSWORD' EXIT
          curl --fail --silent --show-error --proto '=https' --max-time 20 'https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt' -o "$work/ca.crt"
          fingerprint="$(openssl x509 -in "$work/ca.crt" -outform DER | sha256sum | cut -d ' ' -f 1)"
          if [ "$fingerprint" != '807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa' ]; then echo 'BLOCKED: CA differs from verified TLS evidence'; exit 1; fi
          command -v psql >/dev/null || { echo 'BLOCKED: psql unavailable'; exit 1; }
          export PGHOST=aws-1-eu-west-1.pooler.supabase.com PGPORT=5432 PGDATABASE=postgres PGUSER=postgres.ublzmoroanhlcgpnxilw PGSSLMODE=verify-full PGSSLROOTCERT="$work/ca.crt" PGCONNECT_TIMEOUT=12 PGAPPNAME=aurea_admin_readonly_preflight
          export PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=5000'
          if ! psql -X -w -qAt -v ON_ERROR_STOP=1 -c "SELECT (session_user='postgres' AND current_user='postgres' AND current_database()='postgres' AND current_setting('transaction_read_only')='on' AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname=current_user AND rolcreaterole))::text" >"$work/result" 2>"$work/error"; then
            echo 'BLOCKED: verified administrative connection or read-only query failed; raw diagnostics suppressed'
            exit 1
          fi
          if [ "$(cat "$work/result")" != 'true' ]; then echo 'BLOCKED: identity, privilege or read-only guard failed'; exit 1; fi
          echo 'PASS: authenticated postgres session through expected staging pooler with verify-full and read-only guard'
          echo 'PASS: administrative role identity and CREATEROLE confirmed'
          echo 'NO WRITES: no role changes, password-setting SQL, Netlify changes or deployment'
