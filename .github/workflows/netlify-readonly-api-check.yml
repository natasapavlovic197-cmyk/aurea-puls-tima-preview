name: AUREA P3 Netlify release gate (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurea-staging-admin-login
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    environment: aurea-staging-admin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect exact site, deployment isolation and rollback anchor
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const SITE='91ffeb5a-796e-4b2a-9fde-517c7e42f708',BRANCH='integration/employee-ten-domains-step5';
          const keys=['AUREA_DELIVERY_AUTH_USER_ID','AUREA_DELIVERY_AUTH_EMAIL','AUREA_DELIVERY_AUTH_PASSWORD','AUREA_INVITATION_HMAC_SECRET','AUREA_SUPABASE_URL','AUREA_SUPABASE_PUBLISHABLE_KEY'];
          const flags=['AUREA_DELIVERY_ENABLED','AUREA_DELIVERY_DEPLOY_APPROVED','AUREA_B2B_MANAGER_ENABLED','AUREA_B2B_MANAGER_DEPLOY_APPROVED'];
          let phase='guard';
          function check(ok,label){if(!ok)throw Error('blocked');console.log('PASS '+label)}
          async function get(p){
            const r=await fetch('https://api.netlify.com/api/v1'+p,{headers:{authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN,accept:'application/json'},redirect:'error',cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(20000)});
            if(!r.ok){await r.body?.cancel();throw Error('HTTP '+r.status)}
            return {data:await r.json(),more:!!r.headers.get('link')?.includes('rel="next"')};
          }
          const safePath=x=>typeof x==='string'&&x.length<=200&&/^[a-zA-Z0-9_./-]*$/.test(x)?x:null;
          const safeId=x=>typeof x==='string'&&/^[a-zA-Z0-9_-]{1,128}$/.test(x)?x:null;
          (async()=>{
            check(process.env.GITHUB_REPOSITORY==='natasapavlovic197-cmyk/aurea-puls-tima-preview'&&process.env.GITHUB_REF==='refs/heads/'+BRANCH&&process.env.NETLIFY_SITE_ID===SITE&&!!process.env.NETLIFY_AUTH_TOKEN,'exact execution boundary');
            phase='site';
            const site=(await get('/sites/'+SITE)).data,b=site.build_settings||{};
            check(site.id===SITE&&site.name==='aurea-puls-tima-preview'&&b.repo_branch==='main'&&(b.stop_builds??site.stop_builds)===true&&!!safeId(site.account_id),'exact site, main production branch, builds stopped');
            const meta={base:safePath(b.base),publish:safePath(b.dir),functions:safePath(b.functions_dir),buildCommandPresent:typeof b.cmd==='string'&&b.cmd.length>0,repoBranch:b.repo_branch,allowedBranches:Array.isArray(b.allowed_branches)?b.allowed_branches.filter(x=>typeof x==='string'&&/^[a-zA-Z0-9_./-]{1,160}$/.test(x)):null,branchDeployPolicy:typeof b.branch_deploy==='boolean'?b.branch_deploy:null,deployPreviewPolicy:typeof b.deploy_previews==='boolean'?b.deploy_previews:null};
            console.log('SITE_METADATA '+JSON.stringify(meta));
            phase='production rollback anchor';
            const anchor=site.published_deploy?.id||site.deploy_id;
            check(!!safeId(anchor),'published deploy anchor present');
            const prod=(await get('/sites/'+SITE+'/deploys/'+encodeURIComponent(anchor))).data;
            check(prod.id===anchor&&prod.site_id===SITE&&prod.state==='ready'&&prod.context==='production','published deploy ready and production context');
            console.log('PRODUCTION_ANCHOR '+JSON.stringify({id:anchor,branch:safePath(prod.branch),commit:safeId(prod.commit_ref),context:prod.context,state:prod.state}));
            phase='deploy inventory';
            const list=await get('/sites/'+SITE+'/deploys?per_page=100');
            check(Array.isArray(list.data),'deploy inventory available');
            const candidates=list.data.filter(d=>d.branch===BRANCH).map(d=>({id:safeId(d.id),context:['production','branch-deploy','deploy-preview'].includes(d.context)?d.context:null,state:safeId(d.state),commit:safeId(d.commit_ref)}));
            console.log('BRANCH_HISTORY '+JSON.stringify({complete:!list.more,entries:candidates}));
            phase='secret metadata';
            const base='/accounts/'+encodeURIComponent(site.account_id)+'/env';
            const shared=await get(base),local=await get(base+'?site_id='+SITE);
            check(!shared.more&&!local.more&&Array.isArray(shared.data)&&Array.isArray(local.data),'complete env inventory');
            check(!shared.data.some(x=>keys.includes(x.key)||flags.includes(x.key))&&!local.data.some(x=>flags.includes(x.key)),'no shared delivery keys or activation flags');
            for(const k of keys){
              const rows=local.data.filter(x=>x.key===k),v=rows[0];
              check(rows.length===1&&v.is_secret===true&&Array.isArray(v.scopes)&&v.scopes.length===1&&v.scopes[0]==='functions'&&Array.isArray(v.values)&&v.values.length===1&&v.values[0].context==='branch'&&v.values[0].context_parameter===BRANCH,'branch-only Functions metadata '+k);
            }
            phase='unchanged production';
            const after=(await get('/sites/'+SITE)).data;
            check((after.published_deploy?.id||after.deploy_id)===anchor&&(after.build_settings?.stop_builds??after.stop_builds)===true,'production anchor unchanged and builds still stopped');
            console.log('READ ONLY COMPLETE; branch deployment capability and rollback procedure require review of returned metadata and provider documentation. No deployment or restore executed.');
          })().catch(()=>{console.error('BLOCKED '+phase+'; raw diagnostics suppressed');process.exitCode=1});
          NODE
