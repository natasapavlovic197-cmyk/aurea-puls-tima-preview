name: AUREA P2.4 pooler TLS preflight (no credentials)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurea-staging-tls-preflight
  cancel-in-progress: false
jobs:
  tls:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: DNS TCP PostgreSQL SSLRequest and verified TLS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import socket, ssl, struct, sys, os, urllib.request, hashlib
          HOST = "aws-1-eu-west-1.pooler.supabase.com"
          PORT = 5432
          phase = "guard"
          try:
              if os.environ.get("GITHUB_REF") != "refs/heads/integration/employee-ten-domains-step5" or os.environ.get("GITHUB_REPOSITORY") != "natasapavlovic197-cmyk/aurea-puls-tima-preview":
                  raise RuntimeError("guard")
              phase = "public CA download"
              url = "https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt"
              with urllib.request.urlopen(url, timeout=15) as response:
                  if response.geturl() != url:
                      raise RuntimeError("unexpected CA redirect")
                  data = response.read(16385)
              if len(data)>16384 or data.count(b"-----BEGIN CERTIFICATE-----")!=1 or b"PRIVATE KEY" in data:
                  raise RuntimeError("unexpected CA format")
              pem = data.decode("ascii")
              der = ssl.PEM_cert_to_DER_cert(pem)
              print("Public CA SHA256: " + hashlib.sha256(der).hexdigest(), flush=True)
              phase = "DNS"
              records = socket.getaddrinfo(HOST, PORT, type=socket.SOCK_STREAM)
              if not records:
                  raise RuntimeError("no records")
              print("PASS DNS: resolved", flush=True)
              phase = "TCP"
              with socket.create_connection((HOST, PORT), timeout=12) as sock:
                  sock.settimeout(12)
                  print("PASS TCP: port 5432", flush=True)
                  phase = "PostgreSQL SSLRequest"
                  sock.sendall(struct.pack("!II", 8, 80877103))
                  if sock.recv(1) != b"S":
                      raise RuntimeError("SSL not accepted")
                  print("PASS PostgreSQL SSLRequest: accepted", flush=True)
                  phase = "TLS certificate and hostname"
                  ctx = ssl.create_default_context(cadata=pem)
                  ctx.minimum_version = ssl.TLSVersion.TLSv1_2
                  assert ctx.check_hostname and ctx.verify_mode == ssl.CERT_REQUIRED
                  with ctx.wrap_socket(sock, server_hostname=HOST) as tls:
                      cert = tls.getpeercert()
                      if not cert or not cert.get("notAfter"):
                          raise RuntimeError("certificate missing")
                      if ssl.cert_time_to_seconds(cert["notAfter"]) <= __import__("time").time():
                          raise RuntimeError("expired")
                      print("PASS certificate trust chain and validity", flush=True)
                      print("PASS hostname verification", flush=True)
                      print("PASS TLS protocol: " + tls.version(), flush=True)
              print("NO AUTH: no PostgreSQL startup message, credentials, SQL, or deployment. Pooler endpoint only; project and login identity not verified.")
          except ssl.SSLCertVerificationError as e:
              print("FAIL " + phase + ": verify_code=" + str(e.verify_code) + "; " + e.verify_message, file=sys.stderr)
              sys.exit(1)
          except Exception as e:
              print("FAIL " + phase + ": " + type(e).__name__, file=sys.stderr)
              sys.exit(1)
          PY
