name: AUREA P2 final authenticated isolation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurea-staging-admin-login
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    environment: aurea-staging-admin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Dedicated Auth and HTTP isolation only
        env:
          AUREA_DELIVERY_AUTH_PASSWORD: ${{ secrets.AUREA_DELIVERY_AUTH_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check architecture/postgrest-runtime/delivery-credentials.cjs
          node --check architecture/postgrest-runtime/delivery-live-final.cjs
          node architecture/postgrest-runtime/delivery-live-final.cjs
