name: AUREA Netlify read-only API check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurea-netlify-readonly-api-check
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    name: Verify Netlify API access (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: aurea-staging-admin
    steps:
      - name: Confirm protected environment gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/integration/employee-ten-domains-step5"
          echo "PASS: execution is restricted to integration/employee-ten-domains-step5."
          echo "PASS: GitHub has admitted this job into aurea-staging-admin."
          echo "INFO: GitHub Environment required reviewers and deployment branch policy are enforced before this step starts."

      - name: Verify Netlify API authorization with read-only GET
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing environment secret NETLIFY_AUTH_TOKEN."
            exit 1
          fi
          if [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "::error::Missing environment variable NETLIFY_SITE_ID."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --max-time 30 \
            --request GET \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            --header "Accept: application/json" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}")"

          if [ "$status" != "200" ]; then
            echo "::error::Netlify read-only site lookup returned HTTP $status."
            exit 1
          fi

          jq -e --arg site_id "$NETLIFY_SITE_ID" '.id == $site_id' "$response_file" >/dev/null
          echo "PASS: Netlify API returned HTTP 200 for the configured site."
          jq '{id, name, url, ssl_url, custom_domain, repo_url, build_settings: {repo_branch: .build_settings.repo_branch}}' "$response_file"

      - name: Inspect owning team plan (read-only)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$NETLIFY_SITE_ID" = "91ffeb5a-796e-4b2a-9fde-517c7e42f708"
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          get() {
            local code
            code="$(curl --silent --show-error --max-time 25 --proto '=https' --request GET --header "Authorization: Bearer $NETLIFY_AUTH_TOKEN" --header 'Accept: application/json' --output "$2" --write-out '%{http_code}' "https://api.netlify.com/api/v1/$1")"
            if [ "$code" != 200 ]; then
              echo "::error::Read-only lookup failed with HTTP $code"
              return 1
            fi
          }
          get "sites/$NETLIFY_SITE_ID" "$tmp/site.json"
          jq -e --arg id "$NETLIFY_SITE_ID" '.id == $id and .name == "aurea-puls-tima-preview"' "$tmp/site.json" >/dev/null
          get accounts "$tmp/accounts.json"
          # Match only the owning team, never infer a plan from another account.
          jq -e --slurpfile site "$tmp/site.json" '
            ($site[0]) as $s |
            map(select((($s.account_id // "") != "" and .id == $s.account_id) or
              (($s.account_slug // "") != "" and .slug == $s.account_slug))) |
            if length == 1 then .[0] else error("Owning team not uniquely resolved") end |
            {plan: (.type_name // .plan // null), plan_type: (.type // null)}
          ' "$tmp/accounts.json" > "$tmp/plan.json"
          jq -e '.plan != null and (.plan | type == "string")' "$tmp/plan.json" >/dev/null
          jq 'with_entries(.value |= (if type == "string" and test("^[A-Za-z0-9 _.-]{1,80}$") then . else "unconfirmed" end))' "$tmp/plan.json"
          jq '{builds_stopped: (if (.build_settings.stop_builds | type) == "boolean" then .build_settings.stop_builds elif (.stop_builds | type) == "boolean" then .stop_builds else "unconfirmed" end)}' "$tmp/site.json"
          echo "READ ONLY: plan metadata does not establish write entitlement. No environment variables retrieved or changed."

  supabase_inspect:
    if: github.ref == 'refs/heads/integration/employee-ten-domains-step5' && github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview'
    name: Supabase staging authorization and pooler (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: aurea-staging-admin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect scoped Supabase API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const ref='ublzmoroanhlcgpnxilw';
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          if(!token?.startsWith('sbp_fc')) {console.error('Scoped token missing or unexpected format');process.exit(1)}
          const root='https://api.supabase.com/v1/projects/'+ref;
          async function get(path,label){
            try{
              const r=await fetch(root+path,{method:'GET',redirect:'error',signal:AbortSignal.timeout(20000),headers:{authorization:'Bearer '+token,accept:'application/json'}});
              console.log(label+' HTTP '+r.status);
              return {status:r.status,data:r.ok?await r.json():null};
            }catch{return {status:0,data:null}}
          }
          (async()=>{
            const p=await get('','Project Settings read');
            if(p.status!==200||(p.data?.ref||p.data?.id)!==ref||p.data?.region!=='eu-west-1'||p.data?.status!=='ACTIVE_HEALTHY')throw Error('Project identity not confirmed');
            const q=await get('/config/database/pooler','Connection Pooling read');
            let endpoint;
            if(q.status===200){
              try{endpoint=require('./architecture/supabase-pooler-metadata.cjs').sessionEndpoint(q.data)}catch{
                // Fixed allowlist only. Do not dump payload or connection strings.
                const rows=Array.isArray(q.data)?q.data:[];
                console.log('Pooler metadata diagnostics: array='+Array.isArray(q.data)+' rows='+rows.length);
                for(const k of ['database_type','db_host','db_port','db_user','db_name','pool_mode','connection_string','connectionString']){
                  console.log(k+' present in rows: '+rows.filter(x=>x&&Object.hasOwn(x,k)).length);
                }
              }
            }
            if(endpoint)console.log('Shared primary session endpoint: '+endpoint.host+':'+endpoint.port+' (metadata only; TLS login not tested)');
            else console.log('Session pooler unconfirmed; response schema not accepted');
            const ssl=await get('/ssl-enforcement','SSL Enforcement read');
            if(ssl.status===200)console.log('SSL enforcement configuration retrieved; actual TLS login not tested');
            // No secrets request in this metadata job. The documented GET response
            // includes a value field; do not retrieve it without separate approval.
            console.log('Secrets inventory: NOT EXECUTED; requires separate edge_functions_secrets_read approval');
            console.log('Secrets write/delete: NOT VERIFIED; edge_functions_secrets_write requires separate approval');
            if(q.status!==200||!endpoint||ssl.status!==200)process.exitCode=1;
          })().catch(()=>{console.error('Read-only preflight stopped');process.exitCode=1});
          NODE
