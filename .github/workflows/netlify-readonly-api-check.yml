name: AUREA Luminous Hamster - read-only authorization
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: aurea-luminous-hamster-readonly
  cancel-in-progress: false
jobs:
  read-only:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/qa/commercial-micro-20261126' && github.actor == 'natasapavlovic197-cmyk'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: aurea-netlify-luminous-readonly
    steps:
      - name: GET only - exact staging site and rollback
        shell: bash
        env:
          NETLIFY_LUMINOUS_READ_TOKEN: ${{ secrets.NETLIFY_LUMINOUS_READ_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          SITE = "07df56d5-e7d6-40a4-b8ab-97b19e1760f7"
          NAME = "luminous-hamster-ec0a1c"
          DEPLOY = "6b035cb77e69d061dba7e1d9"
          TOKEN = os.environ.get("NETLIFY_LUMINOUS_READ_TOKEN", "")
          if not TOKEN.strip():
              sys.exit("BLOCKED: missing protected environment secret")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def get(path):
              req = urllib.request.Request("https://api.netlify.com/api/v1" + path,
                  headers={"Authorization": "Bearer " + TOKEN, "Accept": "application/json"}, method="GET")
              try:
                  with opener.open(req, timeout=20) as response:
                      if response.status != 200:
                          sys.exit("BLOCKED: unexpected HTTP status")
                      return json.loads(response.read(2_000_000))
              except urllib.error.HTTPError as e:
                  sys.exit("BLOCKED: Netlify API HTTP " + str(e.code))
              except Exception:
                  sys.exit("BLOCKED: API transport or response error")
          site = get("/sites/" + SITE)
          if site.get("id") != SITE or site.get("name") != NAME:
              sys.exit("BLOCKED: staging site identity mismatch")
          if (site.get("published_deploy") or {}).get("id") != DEPLOY:
              sys.exit("BLOCKED: published deployment has changed or cannot be confirmed")
          deploy = get("/sites/" + SITE + "/deploys/" + DEPLOY)
          if deploy.get("id") != DEPLOY or deploy.get("site_id") != SITE or deploy.get("state") != "ready":
              sys.exit("BLOCKED: rollback deployment identity or state mismatch")
          print("PASS: authenticated read-only Netlify GETs; exact staging site and current ready deploy")
          print("Site ID:", SITE)
          print("Published deploy:", DEPLOY)
          print("NOTE: host privacy and billing must still be confirmed in Netlify UI; no write or deploy attempted.")
          PY
