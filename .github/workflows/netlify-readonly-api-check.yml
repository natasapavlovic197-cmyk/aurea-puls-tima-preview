name: AUREA JIT read-only check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurea-jit-readonly-check
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: aurea-staging-admin
    steps:
      - name: Read JIT configuration and mapping metadata only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const root='https://api.supabase.com/v1/projects/ublzmoroanhlcgpnxilw/database';
          const known=new Set(['postgres','aurea_limiter_login','aurea_employee_login','aurea_rate_limiter']);
          const allowed=new Set(['/jit-access','/jit','/jit/list']);
          async function get(path){
            if(!allowed.has(path))throw Error('path');
            try{
              const r=await fetch(root+path,{method:'GET',redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+process.env.SUPABASE_ACCESS_TOKEN,Accept:'application/json'}});
              console.log(path+' HTTP '+r.status);
              if(r.status!==200){await r.body?.cancel();return null;}
              if(r.headers.get('link')?.includes('rel="next"')){await r.body?.cancel();return null;}
              return await r.json();
            }catch{console.log(path+' unavailable; details suppressed');return null;}
          }
          function summarize(rows){
            if(!Array.isArray(rows)||rows.some(x=>!x||typeof x.role!=='string'))return null;
            const counts=Object.fromEntries([...known].map(x=>[x,0]));
            let other=0, expired=0, futureExpiry=0, noExpiry=0, unknownExpiry=0, networkRestricted=0, networkUnknown=0, branchesOnly=0, branchUnknown=0;
            for(const r of rows){
              if(known.has(r.role))counts[r.role]++;else other++;
              if(r.expires_at===null)noExpiry++;
              else if(typeof r.expires_at==='number'&&Number.isFinite(r.expires_at)&&r.expires_at>1e12){if(r.expires_at<=Date.now())expired++;else futureExpiry++;}
              else unknownExpiry++;
              const n=r.allowed_networks;
              if(n&&Array.isArray(n.allowed_cidrs)&&Array.isArray(n.allowed_cidrs_v6)){if(n.allowed_cidrs.length+n.allowed_cidrs_v6.length>0)networkRestricted++;}
              else networkUnknown++;
              if(r.branches_only===true)branchesOnly++;else if(r.branches_only!==false)branchUnknown++;
            }
            return {total:rows.length,knownRoleCounts:counts,otherRoleCount:other,expired,futureExpiry,noExpiry,unknownExpiry,networkRestricted,networkUnknown,branchesOnly,branchUnknown};
          }
          (async()=>{
            if(process.env.GITHUB_REPOSITORY!=='natasapavlovic197-cmyk/aurea-puls-tima-preview'||process.env.GITHUB_REF!=='refs/heads/integration/employee-ten-domains-step5'||!process.env.SUPABASE_ACCESS_TOKEN?.startsWith('sbp_fc'))throw Error('guard');
            const c=await get('/jit-access');
            const state=['enabled','disabled','unavailable'].includes(c?.state)?c.state:'unconfirmed';
            console.log(JSON.stringify({state,applied:typeof c?.appliedSuccessfully==='boolean'?c.appliedSuccessfully:'unconfirmed',availability:state==='enabled'||state==='disabled'?'reported_available':state==='unavailable'?'reported_unavailable':'unconfirmed',reason:c?.unavailableReason==='ssl_enforcement_required'?'ssl_enforcement_required':'unconfirmed'}));
            const self=await get('/jit');
            const own=summarize(self?.user_roles);
            console.log(JSON.stringify({callerMappings:own??'unconfirmed'}));
            const all=await get('/jit/list');
            const valid=Array.isArray(all?.items)&&all.items.every(x=>x&&Array.isArray(x.user_roles));
            const summary=valid?summarize(all.items.flatMap(x=>x.user_roles)):null;
            console.log(JSON.stringify({projectMappings:summary??'unconfirmed',mappingRecordCount:summary?all.items.length:'unconfirmed'}));
            if(state==='unconfirmed'||!own||!summary){console.log('PARTIAL: one or more GET results unconfirmed; do not request broader privileges automatically');process.exitCode=1;}
            console.log('GET only. No emails, user IDs, CIDRs, tokens or raw response bodies printed. No JIT changes, SQL or deployment.');
          })().catch(()=>{console.error('BLOCKED: guard or unexpected failure');process.exitCode=1;});
          NODE
