name: AUREA Luminous Hamster - final read-only release gate
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: aurea-luminous-hamster-readonly
  cancel-in-progress: false
jobs:
  gate:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5' && github.actor == 'natasapavlovic197-cmyk'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: aurea-staging-admin
    steps:
      - name: GET only - exact staging host, ready rollback and inventory
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, re, urllib.request, urllib.error, urllib.parse
          SITE = "07df56d5-e7d6-40a4-b8ab-97b19e1760f7"
          NAME = "luminous-hamster-ec0a1c"
          PREVIOUS = "6b08535dedbe8d1d56a1e038"
          ORIGIN = "https://" + NAME + ".netlify.app"
          TOKEN = os.environ.get("NETLIFY_AUTH_TOKEN", "")
          def require(ok, reason):
              if not ok:
                  sys.exit("BLOCKED: " + reason)
          require(bool(TOKEN.strip()), "protected authorization missing")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def get(path):
              req = urllib.request.Request("https://api.netlify.com/api/v1" + path,
                  headers={"Authorization": "Bearer " + TOKEN, "Accept": "application/json"}, method="GET")
              try:
                  with opener.open(req, timeout=15) as response:
                      require(response.status == 200, "unexpected API status")
                      return json.loads(response.read(4_000_000))
              except urllib.error.HTTPError as e:
                  sys.exit("BLOCKED: Netlify API HTTP " + str(e.code))
              except Exception:
                  sys.exit("BLOCKED: API response or transport")
          def locked(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"AUREA-Release-ReadOnly"}, method="GET")
                  with opener.open(req, timeout=10):
                      return False
              except urllib.error.HTTPError as e:
                  if e.code in (401,403): return True
                  loc=urllib.parse.urlparse(e.headers.get("Location",""))
                  return e.code in (301,302,303,307,308) and loc.scheme=="https" and loc.hostname=="app.netlify.com" and any(w in loc.path.lower() for w in ("login","authorize","auth"))
              except Exception:
                  return False
          site = get("/sites/" + SITE)
          require(site.get("id")==SITE and site.get("name")==NAME and not site.get("custom_domain"), "staging identity mismatch")
          published=(site.get("published_deploy") or {}).get("id")
          require(isinstance(published,str) and bool(re.fullmatch(r"[0-9a-f]{24}",published)), "full published deploy ID unavailable")
          dep=get("/sites/"+SITE+"/deploys/"+published)
          require(dep.get("id")==published and dep.get("site_id")==SITE and dep.get("state")=="ready", "current deploy is not a verified ready rollback baseline")
          print("PASS exact staging identity and current ready deploy:", published)
          print("Prior GitHub deployment matches:", published==PREVIOUS)
          history=get("/sites/"+SITE+"/deploys?per_page=25")
          require(isinstance(history,list),"deploy history response unrecognized")
          retained=[d["id"] for d in history if d.get("site_id")==SITE and d.get("state")=="ready" and isinstance(d.get("id"),str) and re.fullmatch(r"[0-9a-f]{24}",d["id"])]
          print("Ready retained deployment count:",len(set(retained)))
          print("Previously recorded deployment retained:", PREVIOUS in retained)
          files=get("/sites/"+SITE+"/files")
          require(isinstance(files,list),"file inventory response unrecognized")
          names={str(f.get("path","")).lstrip("/") for f in files if isinstance(f,dict)}
          print("Published file count:",len(names))
          for p in ["index.html","auth/index.html","_headers","_redirects","puls-app/edukacija/index.html","puls-app/micro/index.html","puls-app/zaposleni/index.html","puls-app/rukovodilac/index.html"]:
              print("Route file",p,":",p in names)
          functions=get("/sites/"+SITE+"/functions")
          if isinstance(functions,list):
              print("Function inventory group count:",len(functions))
          elif isinstance(functions,dict):
              print("Function inventory object empty:",not functions)
          else:
              require(False,"function inventory response unrecognized")
          permalink="https://"+published+"--"+NAME+".netlify.app"
          require(all(locked(h+p) for h in (ORIGIN,permalink) for p in ("/","/auth/","/puls-app/edukacija/")), "private perimeter not confirmed on host and pinned deploy")
          require((get("/sites/"+SITE).get("published_deploy") or {}).get("id")==published,"published deploy moved during check")
          print("PASS private perimeter and stable rollback reference; GET ONLY, no deployment.")
          print("Budget and candidate transfer remain separate mandatory gates.")
          PY
