name: AUREA P3 offline release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Targeted offline regressions
        run: |
          node --test architecture/postgrest-runtime/delivery-identity.test.cjs architecture/postgrest-runtime/delivery-runtime.test.cjs
          node architecture/release-candidate-static.test.cjs
      - name: Build staging candidate without credentials
        env:
          AUREA_POSTGREST_STAGING_BUILD: 'true'
        run: |
          npm install --no-save --ignore-scripts esbuild@0.25.5 @supabase/supabase-js@2.49.4
          node architecture/build-staging-manager.cjs
      - name: Check candidate boundaries
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const dir='dist-staging-manager/';
          const names=fs.readdirSync(dir).sort();
          assert.deepEqual(names,['employee.bundle.js','employee.html','index.html','manager-login.bundle.js','manager-login.css','staging-config.js']);
          for(const f of names){
            const t=fs.readFileSync(dir+f,'utf8');
            assert.ok(t.length>0);
            assert.doesNotMatch(t,/AUREA_DELIVERY_AUTH_PASSWORD|AUREA_INVITATION_HMAC_SECRET|SUPABASE_ACCESS_TOKEN|SUPABASE_ADMIN_DB_PASSWORD|sb_secret_[A-Za-z0-9_-]+/);
            if(f.endsWith('.html'))assert.match(t,/<meta name="referrer" content="no-referrer">/);
          }
          assert.match(fs.readFileSync(dir+'staging-config.js','utf8'),/"transport":"postgrest"/);
          console.log('PASS candidate files, basic secret-marker scan and referrer policy; no deploy');
          NODE
