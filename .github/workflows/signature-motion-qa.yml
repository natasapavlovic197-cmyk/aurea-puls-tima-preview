name: Signature motion QA
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths: ['.github/workflows/signature-motion-qa.yml', 'architecture/signature-motion-qa.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/integration/employee-ten-domains-step5'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node architecture/signature-motion-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signature-motion-visual-qa
          path: artifacts/signature-motion/
          retention-days: 7
