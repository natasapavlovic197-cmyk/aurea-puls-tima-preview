name: AUREA manager login browser QA
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - 'architecture/manager-login*'
      - '.github/workflows/manager-login-browser-qa.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node architecture/manager-login-browser-qa.cjs
