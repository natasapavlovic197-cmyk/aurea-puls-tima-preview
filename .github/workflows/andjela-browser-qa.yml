name: Anđela isolated browser visual QA
on:
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture original and isolated Anđela in Chromium
        run: node architecture/andjela-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andjela-isolated-browser-qa
          path: artifacts/andjela-qa/
          retention-days: 7
