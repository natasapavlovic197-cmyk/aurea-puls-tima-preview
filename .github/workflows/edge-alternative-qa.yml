name: AUREA isolated Edge backend QA
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - 'architecture/edge-alternative/**'
      - '.github/workflows/edge-alternative-qa.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          node architecture/edge-alternative/runtime.test.cjs
          node architecture/psychometric-item-bank.test.cjs
          node architecture/restricted-pg-query.test.cjs
          node architecture/manager-runtime.test.cjs
          node architecture/manager-privacy-threshold.test.cjs
          node architecture/manager-workspace-endpoint.test.cjs
          node architecture/employee-http-integration.test.cjs
  deno:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Build and verify isolated Deno candidate
        run: bash architecture/edge-alternative/build-deno.sh
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-edge-deno-candidate
          path: |
            architecture/edge-alternative/runtime.bundle.cjs
            architecture/edge-alternative/entry.ts
            architecture/edge-alternative/runtime.bundle.d.cts
            architecture/edge-alternative/deno.json
            architecture/edge-alternative/deno.lock
          if-no-files-found: error
