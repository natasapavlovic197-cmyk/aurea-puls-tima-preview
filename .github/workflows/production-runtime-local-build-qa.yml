name: AUREA public route inventory (read only)
on:
  push:
    branches: [qa/production-runtime-local-build-20261125]
    paths: ['.github/workflows/production-runtime-local-build-qa.yml']
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/qa/production-runtime-local-build-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect current public pages using GET only
        run: |
          mkdir -p route-evidence
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse, hashlib, json, re, pathlib, concurrent.futures
          from html.parser import HTMLParser
          base='https://puls.aureapsihoterapija.com'
          alias='https://cheerful-dodol-670625.netlify.app'
          hosts={urllib.parse.urlparse(base).netloc,urllib.parse.urlparse(alias).netloc,'aureapsihoterapija.com','www.aureapsihoterapija.com'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          class Parse(HTMLParser):
              def __init__(self): super().__init__(); self.links=set(); self.title=''; self.in_title=False
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='title': self.in_title=True
                  if tag in ['a','link','script','img','iframe','source']:
                      for k in ['href','src']:
                          if a.get(k) and not a[k].startswith(('data:','javascript:','mailto:','#','tel:')): self.links.add(a[k])
              def handle_endtag(self,tag):
                  if tag=='title': self.in_title=False
              def handle_data(self,data):
                  if self.in_title: self.title+=data
          def inspect(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'AUREA-Owner-ReadOnly-Inventory/1.0','Accept':'text/html,application/xml,text/plain,*/*;q=0.1'},method='GET')
                  try: r=opener.open(req,timeout=12)
                  except urllib.error.HTTPError as e: r=e
                  with r:
                      content=r.read(12*1024*1024+1)
                      if len(content)>12*1024*1024: raise ValueError('body limit')
                      ct=r.headers.get('Content-Type','')
                      row={'url':url,'status':r.status,'type':ct,'size':len(content),'sha256':hashlib.sha256(content).hexdigest(),'headers':{k:r.headers.get(k) for k in ['Content-Security-Policy','Referrer-Policy','X-Robots-Tag','Cache-Control','X-Frame-Options','Location','ETag'] if r.headers.get(k)}}
                      if 'text/html' in ct and r.status==200:
                          p=Parse();p.feed(content.decode('utf-8','replace'));row['title']=p.title[:200]
                          links=set()
                          for link in p.links:
                              u=urllib.parse.urlparse(urllib.parse.urljoin(url,link))
                              if u.scheme=='https' and u.netloc in hosts and not u.query and not u.fragment: links.add(u.netloc+u.path)
                          row['links']=sorted(links)[:150]
                          # Public content only; refuse any suspected credentials from captured HTML.
                          if not re.search(rb'sb_secret_[A-Za-z0-9_-]{10,}|-----BEGIN (?:RSA |EC )?PRIVATE KEY-----',content):
                              name=hashlib.sha256(url.encode()).hexdigest()[:16]+'.html';pathlib.Path('route-evidence',name).write_bytes(content);row['snapshot']=name
                      return row
              except Exception as e: return {'url':url,'error':str(e)[:250]}
          paths=['/','/zaposleni/','/rukovodilac/','/portal/','/portal/auth/','/kringle/','/v4-demo/','/odgovor/','/radni-prostor/','/robots.txt','/sitemap.xml','/poslovni-prostor/','/puls-app/']
          urls=[base+p for p in paths]+[alias+'/','https://aureapsihoterapija.com/','https://aureapsihoterapija.com/za-organizacije']
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: rows=list(pool.map(inspect,urls))
          pathlib.Path('route-evidence/inventory.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          for row in rows: print(json.dumps({k:v for k,v in row.items() if k!='links'},ensure_ascii=False))
          print('PUBLIC ROUTE INVENTORY ONLY; not proof of complete deploy backup; no writes or activation')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aurea-current-public-route-inventory
          path: route-evidence/
          retention-days: 7
          if-no-files-found: error
