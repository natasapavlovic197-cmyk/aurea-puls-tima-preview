name: AUREA final public DNS and redirect preflight (no deploy)
on:
  push:
    branches: [qa/production-runtime-local-build-20261125]
    paths: ['.github/workflows/production-runtime-local-build-qa.yml']
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview' && github.ref == 'refs/heads/qa/production-runtime-local-build-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Public DNS authority, HTTPS and route collision evidence
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, hashlib, concurrent.futures
          zone='aureapsihoterapija.com'
          host='puls.'+zone
          alias='cheerful-dodol-670625.netlify.app'
          permalink='6b069c35e6b3e3533864bbe6--'+alias
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw):return None
          opener=urllib.request.build_opener(NoRedirect())
          def dns(pair):
              name,typ=pair
              try:
                  with urllib.request.urlopen('https://dns.google/resolve?name='+name+'&type='+typ,timeout=10) as r:
                      j=json.load(r);return {'name':name,'type':typ,'status':j.get('Status'),'answer':j.get('Answer',[]),'authority':j.get('Authority',[])}
              except Exception as e:return {'name':name,'type':typ,'error':str(e)[:180]}
          def inspect(url):
              try:
                  try:r=opener.open(urllib.request.Request(url,headers={'User-Agent':'AUREA-Owner-ReadOnly-Preflight/1.0'},method='GET'),timeout=10)
                  except urllib.error.HTTPError as e:r=e
                  with r:
                      b=r.read(10*1024*1024+1)
                      return {'url':url,'status':r.status,'sha256':hashlib.sha256(b).hexdigest(),'size':len(b),'location':r.headers.get('Location'),'csp':r.headers.get('Content-Security-Policy'),'referrer':r.headers.get('Referrer-Policy'),'robots':r.headers.get('X-Robots-Tag')}
              except Exception as e:return {'url':url,'error':str(e)[:180]}
          pairs=[(zone,'NS'),(zone,'SOA'),(host,'A'),(host,'AAAA'),(host,'CNAME'),(host,'NS')]
          urls=['https://'+alias+p for p in ['/','/puls-app/rukovodilac/','/puls-app/zaposleni/','/puls-app/edukacija/','/not-aurea-route-20261125/']]+['https://'+permalink+'/','https://'+host+'/']
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as p:
              for row in p.map(dns,pairs):print('DNS '+json.dumps(row))
              for row in p.map(inspect,urls):print('HTTP '+json.dumps(row))
          print('READ ONLY; no authentication or configuration writes')
          PY
