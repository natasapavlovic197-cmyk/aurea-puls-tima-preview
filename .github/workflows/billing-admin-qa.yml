name: AUREA Billing Admin integrated QA
on:
  push:
    branches: [commercial/step6-isolated]
    paths: ['.github/workflows/billing-admin-qa.yml']
permissions:
  contents: read
jobs:
  integrated:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_billing_admin_qa
          POSTGRES_DB: aurea_billing_admin_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable_billing_admin_qa
      PGDATABASE: aurea_billing_admin_fixture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install disposable commercial and Auth fixtures
        run: |
          set -eu
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = aurea_billing_admin_fixture
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users(id uuid PRIMARY KEY,deleted_at timestamptz,is_anonymous boolean NOT NULL DEFAULT false,banned_until timestamptz);
          CREATE TABLE auth.sessions(id uuid PRIMARY KEY,user_id uuid REFERENCES auth.users(id),not_after timestamptz);
          CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $$ SELECT coalesce(nullif(current_setting('request.jwt.claims',true),''),'{}')::jsonb $$;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT (auth.jwt()->>'sub')::uuid $$;
          CREATE SCHEMA aurea_private;
          CREATE TABLE aurea_private.organizations(id uuid PRIMARY KEY,name text NOT NULL);
          SQL
          for f in step6-candidate.sql step5-lifecycle.review.sql admin-server.review.sql admin-auth-staging.review.sql admin-private-dispatch.review.sql admin-operator-expiry.review.sql billing.review.sql billing-admin.review.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "architecture/commercial/$f"
          done
      - name: New integrated billing admin tests only
        run: psql -X -v ON_ERROR_STOP=1 -f architecture/commercial/billing-admin.synthetic.sql
      - name: Check integrated portal script syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('architecture/commercial/billing-admin-staging-portal.html').read_text()
          script=re.search(r'<script>(.*?)</script>',html,re.S).group(1)
          Path('/tmp/aurea-billing-portal.cjs').write_text(script)
          PY
          node --check /tmp/aurea-billing-portal.cjs
