name: AUREA manager staging build
on:
  push:
    branches: [integration/employee-ten-domains-step5]
    paths:
      - 'architecture/**'
      - '.github/workflows/manager-staging-build.yml'
  pull_request:
    paths:
      - 'architecture/**'
      - '.github/workflows/manager-staging-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts esbuild@0.25.5 @supabase/supabase-js@2.49.4 playwright@1.51.1
      - run: node architecture/build-staging-manager.cjs
      - name: Verify employee and manager bundle files
        run: test -s dist-staging-manager/employee.html && test -s dist-staging-manager/employee.bundle.js && test -s dist-staging-manager/manager-login.bundle.js
      - run: npx playwright install --with-deps chromium
      - run: node architecture/employee-staging-browser-qa.cjs
      - run: node architecture/premium-manager-browser-qa.cjs
      - run: node architecture/joint-premium-security-qa.cjs
      - run: node --test architecture/manager-company-selector.test.cjs architecture/restricted-pg-query.test.cjs architecture/employee-runtime.test.cjs architecture/employee-server-gateway.test.cjs architecture/restricted-employee-adapter.test.cjs
      - run: node --test architecture/published-manager-report.test.cjs architecture/manager-authorized-service.test.cjs architecture/manager-workspace-endpoint.test.cjs architecture/supabase-manager-bridge.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: aurea-manager-staging
          path: dist-staging-manager/
          retention-days: 3
          if-no-files-found: error
