name: AUREA preview mobile functional QA
on:
  push:
    paths:
      - 'index.html'
      - 'zaposleni/**'
      - 'rukovodilac/**'
      - 'tests/**'
      - 'playwright.config.cjs'
      - '.github/workflows/preview-mobile-qa.yml'
  workflow_dispatch:
jobs:
  mobile-qa:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated demo and role navigation
        shell: python
        run: |
          from pathlib import Path
          files=['index.html','zaposleni/index.html','rukovodilac/index.html']
          for name in files:
              s=Path(name).read_text(encoding='utf-8')
              assert '<html' in s.lower() and '</html>' in s.lower(),name
              assert s.count('<script')==s.count('</script>'),name
          a=Path('index.html').read_text(encoding='utf-8')
          e=Path('zaposleni/index.html').read_text(encoding='utf-8')
          m=Path('rukovodilac/index.html').read_text(encoding='utf-8')
          assert './zaposleni/' in a and './rukovodilac/' in a
          assert 'Nazad na Puls tima' in e and 'Nazad na Puls tima' in m
          assert 'Interaktivna demonstracija' in e and 'Interaktivna demonstracija' in m
          assert 'aurea-role-signature' in e and 'aurea-role-signature' in m
          assert 'sessionStorage.setItem' in m and 'sessionStorage.getItem' in m
          assert 'href="../portal/"' not in m
          print('PASS: isolated roles, navigation, emblems and demo boundaries')
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run iPhone-size browser tests
        run: npx playwright test --workers=1 --reporter=list
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurea-preview-mobile-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
