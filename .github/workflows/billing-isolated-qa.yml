name: AUREA Billing isolated QA
on:
  push:
    branches: [commercial/step6-isolated]
    paths: ['.github/workflows/billing-isolated-qa.yml']
permissions:
  contents: read
jobs:
  billing:
    if: github.repository == 'natasapavlovic197-cmyk/aurea-puls-tima-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_billing_qa
          POSTGRES_DB: aurea_billing_fixture
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable_billing_qa
      PGDATABASE: aurea_billing_fixture
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install disposable fixtures and billing candidate
        run: |
          set -eu
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = aurea_billing_fixture
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA aurea_private;
          CREATE TABLE aurea_private.organizations(id uuid PRIMARY KEY,name text NOT NULL);
          SQL
          psql -X -v ON_ERROR_STOP=1 -f architecture/commercial/step6-candidate.sql
          psql -X -v ON_ERROR_STOP=1 -f architecture/commercial/step5-lifecycle.review.sql
          psql -X -v ON_ERROR_STOP=1 -f architecture/commercial/billing.review.sql
      - name: New billing SQL tests only
        run: psql -X -v ON_ERROR_STOP=1 -f architecture/commercial/billing.synthetic.sql
      - name: Sandbox signature and renewal tests
        run: node --test architecture/commercial/billing-sandbox.test.cjs
