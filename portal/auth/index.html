<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>AUREA | Aktivacija naloga</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#f8f4ef;color:#482c36;margin:0;padding:24px}.panel{max-width:480px;margin:10vh auto;background:white;padding:32px;border-radius:18px;border:1px solid #e5d8ce}h1{font:normal 32px Georgia,serif;color:#762e42}input,button{width:100%;box-sizing:border-box;padding:13px;margin:10px 0;border-radius:8px;border:1px solid #d8c7c3;font:inherit}button{background:#762e42;color:white}button:disabled{opacity:.5}a{color:#762e42}</style><style id="aurea-portal-premium">:root{--aurea-wine:#532331;--aurea-cream:#f8f4ee;--aurea-gold:#b89975}body{background:var(--aurea-cream);color:#3c2a30;font-family:Georgia,'Times New Roman',serif}label,input,select,button,table,nav{font-family:Georgia,'Times New Roman',serif!important}input,select,button{font-size:16px!important}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--aurea-gold);outline-offset:3px}.aurea-portal-nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:24px}.aurea-portal-nav a{color:var(--aurea-wine);text-decoration:none;border:1px solid #d8c8bf;border-radius:999px;padding:9px 14px;background:#fffaf6;font:15px/1.4 Georgia,serif}.aurea-portal-nav a:hover{background:#f1e6df}@media(max-width:560px){.wrap,.panel{padding:22px;margin:16px auto}.aurea-portal-nav{gap:8px}.aurea-portal-nav a{font-size:14px}}</style></head><body><main class="panel"><nav class="aurea-portal-nav" aria-label="Navigacija"><a href="/">← Puls tima</a><a href="/portal/">Prijava rukovodioca</a></nav><small>AUREA / PULS TIMA / TEST</small><h1>Aktivirajte nalog</h1><p id="status" role="status">Provera pozivnice…</p><form id="form" hidden><label for="pass">Nova lozinka (najmanje 12 znakova)</label><input id="pass" type="password" minlength="12" autocomplete="new-password" required><label for="confirm">Ponovite lozinku</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button>Postavite lozinku</button></form><p><a href="/portal/">Nazad na testnu prijavu</a></p></main><script>
'use strict';const base='https://ublzmoroanhlcgpnxilw.supabase.co';const key='sb_publishable_Za18LIyl1qfx2Tlucyj3Xg_CSWRukS6';const s=document.getElementById('status'),form=document.getElementById('form');let access=null;const hash=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);const err=hash.get('error_description')||query.get('error_description');const tokenHash=query.get('token_hash');const type=query.get('type');history.replaceState(null,'',location.pathname);async function init(){if(err){s.textContent='Link nije važeći: '+err;return}try{if(tokenHash&&['invite','recovery','signup'].includes(type)){const r=await fetch(base+'/auth/v1/verify',{method:'POST',headers:{'Content-Type':'application/json','apikey':key},body:JSON.stringify({token_hash:tokenHash,type})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Neuspešna potvrda');access=d.access_token;}else{access=hash.get('access_token');if(!access)throw Error('Link ne sadrži aktivacioni token. Zatražite novu pozivnicu.');}s.textContent='Pozivnica je prepoznata. Postavite novu lozinku.';form.hidden=false;}catch(e){s.textContent=e.message}}init();form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('pass').value;if(p!==document.getElementById('confirm').value){s.textContent='Lozinke se ne podudaraju.';return}if(p.length<12){s.textContent='Lozinka mora imati najmanje 12 znakova.';return}form.querySelector('button').disabled=true;try{const r=await fetch(base+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+access},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Promena lozinke nije uspela');access=null;form.hidden=true;s.textContent='Lozinka je postavljena. Možete se prijaviti na testni portal.';}catch(e){s.textContent=e.message;form.querySelector('button').disabled=false}});
</script></body></html>
